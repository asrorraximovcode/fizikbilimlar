<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elektr va Magnetizm Praktikumi</title>
<meta name="description" content="Elektr va magnetizm bo‘yicha o‘quv platformasi: 14 modul, 3 darajali testlar, mashqlar va 14 laboratoriya simulyatori.">
<meta name="theme-color" content="#070B11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%2210%22 fill=%22%230E1620%22/%3E%3Cpath d=%22M11 29V17a9 9 0 0 1 18 0v12%22 stroke=%22%23FF5B8A%22 stroke-width=%223.4%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M11 29h5.2M23.8 29H29%22 stroke=%22%232BD9C9%22 stroke-width=%223.4%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: o‘lchov asbobi paneli — chapda rail, o‘ngda bitta ustunli ish maydoni;
   telefonda rail pastga tushadi. Ranglar fizika kodlari bilan: teal = maydon,
   amber = tok, rose = magnit. */
:root{
  --bg:#070B11; --panel:#0E1620; --panel2:#15202C; --panel3:#1C2936;
  --line:#243343; --line2:#31424f;
  --fg:#E8EFF6; --fg2:#9CAEC2; --fg3:#67788C;
  --volt:#2BD9C9; --amp:#FFA23A; --mag:#FF5B8A;
  --ok:#3DD68C; --warn:#F5C04A; --bad:#FF6B6B;
  --grid:rgba(43,217,201,.08);
  --shadow:0 18px 40px -22px rgba(0,0,0,.85);
  --radius:14px;
  --f-disp:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EFF4F8; --panel:#FFFFFF; --panel2:#E7EEF5; --panel3:#DBE6EF;
    --line:#CBD9E5; --line2:#B3C5D4;
    --fg:#0A141E; --fg2:#4B5F75; --fg3:#6B7F95;
    --volt:#0C8C82; --amp:#A85D06; --mag:#BE2A5E;
    --ok:#15803D; --warn:#92610A; --bad:#BE2A2A;
    --grid:rgba(12,140,130,.10);
    --shadow:0 14px 30px -20px rgba(16,40,64,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EFF4F8; --panel:#FFFFFF; --panel2:#E7EEF5; --panel3:#DBE6EF;
  --line:#CBD9E5; --line2:#B3C5D4;
  --fg:#0A141E; --fg2:#4B5F75; --fg3:#6B7F95;
  --volt:#0C8C82; --amp:#A85D06; --mag:#BE2A5E;
  --ok:#15803D; --warn:#92610A; --bad:#BE2A2A;
  --grid:rgba(12,140,130,.10);
  --shadow:0 14px 30px -20px rgba(16,40,64,.35);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:var(--volt)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:1fr;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding-block:10px;min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0;overflow:hidden}
.brand-txt b{font-family:var(--f-disp);font-size:15px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;color:var(--fg3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sp{flex:1;min-width:0}
@media (max-width:640px){ .brand-txt{display:none} .who input{width:88px} }
.who{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px}
.who label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--fg3);text-transform:uppercase}
.who input{width:104px;background:transparent;border:0;outline:none;font-size:14px;font-weight:600;padding:2px 4px;min-width:0}
.who input:focus-visible{outline:2px solid var(--volt);outline-offset:1px;border-radius:6px}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);flex:none}
.iconbtn:hover{border-color:var(--volt);color:var(--volt)}
.iconbtn:focus-visible{outline:2px solid var(--volt);outline-offset:2px}

/* progress ring */
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:700}

/* ---------- rail ---------- */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;
  background:color-mix(in srgb,var(--panel) 95%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.navbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:8px 2px 7px;color:var(--fg3);border-top:2px solid transparent;margin-top:-1px}
.navbtn svg{width:21px;height:21px}
.navbtn span{font-size:10.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.navbtn.on{color:var(--volt);border-top-color:var(--volt)}
.navbtn:focus-visible{outline:2px solid var(--volt);outline-offset:-2px}

.main{padding-bottom:84px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 10px;max-width:1120px;margin:0 auto;width:100%}

@media (min-width:980px){
  .shell{grid-template-columns:236px 1fr}
  .topbar{grid-column:1/-1}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);left:auto;right:auto;bottom:auto;align-self:start;
    flex-direction:column;gap:4px;height:auto;border-top:0;border-right:1px solid var(--line);
    padding:18px 12px 24px;background:transparent;backdrop-filter:none}
  .navbtn{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;width:100%;
    padding:10px 12px;border-radius:11px;border-top:0;border-left:2px solid transparent;margin-top:0}
  .navbtn span{font-size:14px}
  .navbtn.on{background:var(--panel2);border-left-color:var(--volt)}
  .main{padding-bottom:40px;min-width:0}
  .wrap{padding-block:28px 40px}
}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--fg);
  border-radius:10px;padding:10px 16px;font-weight:600;font-size:14.5px;transition:.15s}
.btn:hover{border-color:var(--volt);color:var(--volt)}
.btn:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--volt);border-color:var(--volt);color:#04151a;font-weight:700}
.btn-main:hover{color:#04151a;filter:brightness(1.08)}
:root[data-theme="light"] .btn-main,
:root:not([data-theme="dark"]) .btn-main{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-main{color:#04151a}}
:root[data-theme="dark"] .btn-main{color:#04151a}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn-amp:hover{border-color:var(--amp);color:var(--amp)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.sep{height:1px;background:var(--line);border:0;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--fg2)}
.chip.volt{color:var(--volt);border-color:color-mix(in srgb,var(--volt) 42%,transparent);background:color-mix(in srgb,var(--volt) 12%,transparent)}
.chip.amp{color:var(--amp);border-color:color-mix(in srgb,var(--amp) 42%,transparent);background:color-mix(in srgb,var(--amp) 12%,transparent)}
.chip.mag{color:var(--mag);border-color:color-mix(in srgb,var(--mag) 42%,transparent);background:color-mix(in srgb,var(--mag) 12%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 42%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:clamp(24px,5vw,34px)}
.page-h p{color:var(--fg2);font-size:14.5px;max-width:62ch;margin-top:5px}

.bar{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--volt);transition:width .5s cubic-bezier(.2,.8,.2,1)}

.fml{font-family:var(--f-mono);font-size:15px;background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--volt);border-radius:8px;padding:9px 13px;display:block;overflow-x:auto;white-space:nowrap}
.fml sub,.fml sup{font-size:.72em}
.note{font-size:13.5px;color:var(--fg2)}

table.data{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
table.data th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:7px 9px;border-bottom:1px solid var(--line)}
table.data td{padding:7px 9px;border-bottom:1px solid var(--line)}
table.data tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}

.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:5px;height:12px;border-radius:2px;background:var(--line2);display:block}
.lvl i.f{background:var(--amp)}

.fade{animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .fade,.pop{animation:none}
  *{transition-duration:.01ms !important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<style>
/* ---------- bosh sahifa ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(145deg,var(--panel) 0%,var(--panel2) 100%);padding:24px}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(120% 90% at 85% 10%,#000 10%,transparent 72%)}
.hero-in{position:relative;display:grid;gap:20px}
.hero h1{font-size:clamp(26px,6.2vw,42px);letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--volt)}
.hero p{color:var(--fg2);max-width:52ch;margin-top:9px;font-size:15px}
.hero-fx{height:140px;border-radius:12px;border:1px solid var(--line);background:var(--bg);overflow:hidden;position:relative}
.hero-fx canvas{display:block;width:100%;height:100%}
@media (min-width:860px){.hero{padding:30px 32px}.hero-in{grid-template-columns:1.05fr .95fr;align-items:center;gap:30px}.hero-fx{height:198px}}

.secgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(min(100%,228px),1fr))}
.seccard{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:11px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;transition:.18s}
.seccard:hover{border-color:var(--c,var(--volt));transform:translateY(-2px);box-shadow:var(--shadow)}
.seccard:focus-visible{outline:2px solid var(--c,var(--volt));outline-offset:2px}
.seccard-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c,var(--volt)) 14%,transparent);color:var(--c,var(--volt));flex:none}
.seccard-ic svg{width:22px;height:22px}
.seccard h3{font-size:17.5px}
.seccard p{font-size:13.5px;color:var(--fg2);flex:1}
.seccard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--fg3);letter-spacing:.05em}

/* o‘zlashtirish xaritasi */
.heat{display:grid;gap:5px;grid-template-columns:repeat(auto-fit,minmax(42px,1fr))}
.hcell{position:relative;aspect-ratio:1;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;
  font-weight:700;color:var(--fg3);transition:.18s}
.hcell:hover{transform:scale(1.08);z-index:2;border-color:var(--volt)}
.hcell:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.hcell[data-s="0"]{background:var(--panel2)}
.hcell[data-s="1"]{background:color-mix(in srgb,var(--bad) 30%,var(--panel2));color:var(--fg);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.hcell[data-s="2"]{background:color-mix(in srgb,var(--warn) 32%,var(--panel2));color:var(--fg);border-color:color-mix(in srgb,var(--warn) 48%,transparent)}
.hcell[data-s="3"]{background:color-mix(in srgb,var(--ok) 34%,var(--panel2));color:var(--fg);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.hcell[data-s="4"]{background:color-mix(in srgb,var(--ok) 62%,var(--panel2));color:#fff;border-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--fg3);font-family:var(--f-mono)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

.stat{display:grid;gap:3px}
.stat b{font-family:var(--f-mono);font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg3)}
.statrow{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}

/* ---------- modul ---------- */
.mlist{display:grid;gap:11px}
.mcard{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;transition:.16s;width:100%}
.mcard:hover{border-color:var(--volt);transform:translateX(3px)}
.mcard:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.mnum{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);
  font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line);color:var(--fg2)}
.mcard.done .mnum{background:color-mix(in srgb,var(--ok) 20%,transparent);border-color:var(--ok);color:var(--ok)}
.mcard h3{font-size:15.5px;font-family:var(--f-body);font-weight:650;letter-spacing:0}
.mcard p{font-size:12.5px;color:var(--fg3);margin-top:2px}
.secttl{display:flex;align-items:center;gap:11px;margin:24px 0 11px}
.secttl:first-child{margin-top:0}
.secttl h2{font-size:14px;letter-spacing:.11em;text-transform:uppercase;font-family:var(--f-mono);font-weight:500;color:var(--fg2);white-space:nowrap}
.secttl .ln{flex:1;height:1px;background:var(--line)}

.lesson{display:grid;gap:16px;max-width:860px}
.concept{border-left:2px solid var(--line);padding-left:15px}
.concept h4{font-size:16px;margin-bottom:5px;font-family:var(--f-body);font-weight:700}
.concept p{font-size:14.5px;color:var(--fg2)}
.concept + .concept{margin-top:14px}
.deff{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.deff .eyebrow{margin-bottom:6px;display:block}
.vizbox{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.vizbox canvas{display:block;width:100%;height:230px}
.vizcap{padding:9px 13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg3);background:var(--panel)}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg3);margin-bottom:12px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--volt);font-family:inherit;font-size:inherit}
.crumb button:hover{text-decoration:underline}

/* ---------- test / mashq ---------- */
.pickgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.pick{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;transition:.16s}
.pick:hover{border-color:var(--volt)}
.pick.on{border-color:var(--volt);background:color-mix(in srgb,var(--volt) 10%,var(--panel))}
.pick:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.pick b{display:block;font-size:14.5px;font-weight:650}
.pick small{display:block;color:var(--fg3);font-size:12px;margin-top:3px}

.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qhead .bar{flex:1;min-width:120px}
.qtext{font-size:17.5px;font-weight:600;line-height:1.45;font-family:var(--f-body)}
.opts{display:grid;gap:9px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:11px;align-items:start;text-align:left;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;transition:.14s;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--volt)}
.opt:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.opt i{font-family:var(--f-mono);font-weight:700;font-size:12.5px;width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line);font-style:normal;color:var(--fg3)}
.opt.sel{border-color:var(--volt);background:color-mix(in srgb,var(--volt) 11%,var(--panel2))}
.opt.sel i{background:var(--volt);color:#04151a;border-color:var(--volt)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--panel2))}
.opt.good i{background:var(--ok);color:#04150c;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--panel2))}
.opt.wrong i{background:var(--bad);color:#1a0505;border-color:var(--bad)}
.why{margin-top:14px;border-radius:11px;padding:13px 15px;font-size:14.5px;border:1px solid var(--line);background:var(--panel2);border-left:3px solid var(--volt)}
.why b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px;color:var(--fg3)}

.ansrow{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap}
.ansin{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:4px 13px}
.ansin input{width:120px;background:transparent;border:0;outline:none;font-family:var(--f-mono);font-size:17px;font-weight:700;padding:9px 0;min-width:0}
.ansin span{font-family:var(--f-mono);font-size:14px;color:var(--fg3);white-space:nowrap}
.steps{display:grid;gap:9px;counter-reset:st}
.step{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:start}
.step::before{counter-increment:st;content:counter(st);font-family:var(--f-mono);font-size:11.5px;font-weight:700;
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--panel3);color:var(--volt);border:1px solid var(--line)}
.step p{font-size:14.5px}
.step .fml{margin-top:6px;font-size:14px}
.given{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.gitem{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.gitem b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:700}
.gitem span{font-size:11px;color:var(--fg3);font-family:var(--f-mono);letter-spacing:.06em}

/* ---------- natija / AI ---------- */
.score{display:grid;place-items:center;gap:4px;padding:6px 0}
.score b{font-family:var(--f-mono);font-size:46px;font-weight:700;line-height:1;letter-spacing:-.03em}
.score span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.tagbars{display:grid;gap:9px}
.tagbar{display:grid;grid-template-columns:118px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.tagbar .nm{color:var(--fg2);font-size:13px}
.tagbar .vl{font-family:var(--f-mono);font-size:12.5px;text-align:right;color:var(--fg2)}
.ai{border:1px solid color-mix(in srgb,var(--volt) 35%,var(--line));border-radius:var(--radius);
  background:linear-gradient(160deg,color-mix(in srgb,var(--volt) 7%,var(--panel)),var(--panel) 62%);padding:18px}
.ai h3{font-size:17px;display:flex;align-items:center;gap:9px}
.ai-body{margin-top:13px;display:grid;gap:13px}
.ai-sec h4{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px}
.ai-sec ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14.5px}
.ai-sec p{font-size:14.5px}
.ai-stream{font-size:14.5px;white-space:pre-wrap;line-height:1.65}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--volt);margin-right:3px;animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- laboratoriya ---------- */
.simwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.simstage{position:relative;background:var(--bg);border-bottom:1px solid var(--line)}
.simstage canvas{display:block;width:100%;height:300px;touch-action:none}
@media (min-width:720px){.simstage canvas{height:340px}}
.simctl{padding:14px;display:grid;gap:13px}
.sld{display:grid;gap:5px}
.sld .lb{display:flex;justify-content:space-between;align-items:baseline;gap:9px;font-size:13px}
.sld .lb span{color:var(--fg2)}
.sld .lb b{font-family:var(--f-mono);font-size:14.5px;font-weight:700;color:var(--volt)}
.sld input[type=range]{width:100%;accent-color:var(--volt);height:22px}
.sldgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.readout{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.ro{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.ro b{display:block;font-family:var(--f-mono);font-size:17px;font-weight:700;letter-spacing:-.01em}
.ro span{font-size:10.5px;font-family:var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--fg3)}
.ro.amp b{color:var(--amp)}.ro.volt b{color:var(--volt)}.ro.mag b{color:var(--mag)}
.switchrow{display:flex;flex-wrap:wrap;gap:7px}
.sw{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
.sw.on{background:color-mix(in srgb,var(--volt) 15%,var(--panel2));border-color:var(--volt);color:var(--volt)}
.sw:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.labsteps{display:grid;gap:7px;counter-reset:ls;margin:0;padding:0;list-style:none}
.labsteps li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px;color:var(--fg2)}
.labsteps li::before{counter-increment:ls;content:counter(ls);font-family:var(--f-mono);font-size:11px;font-weight:700;
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--panel2);color:var(--volt);border:1px solid var(--line);margin-top:2px}
.extlinks{display:grid;gap:7px}
.extlink{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:9px 12px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--line);color:var(--fg);text-decoration:none}
.extlink:hover{border-color:var(--volt);color:var(--volt)}
.extlink svg{width:15px;height:15px;flex:none;opacity:.7}
.extlink span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{text-align:center;padding:34px 18px;color:var(--fg3)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:80;background:var(--panel3);border:1px solid var(--line2);border-radius:11px;padding:11px 17px;
  font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:980px){.toast{bottom:28px}}

<script>
/* ============ MA'RUZA MAVZULARI (14 modul) ============ */
const SECTIONS = [
  {id:'elektr', name:'Elektr', c:'var(--volt)', mods:[1,2,3,4,5,6]},
  {id:'magnet', name:'Magnetizm', c:'var(--mag)', mods:[7,8,9,10]},
  {id:'tebranish', name:'Tebranishlar va to‘lqinlar', c:'var(--amp)', mods:[11,12,13,14]}
];

const MODULES = [
{
  id:1, sec:'elektr', title:'Elektr zaryadi va elektr maydon', viz:'coulomb',
  vizcap:'Ikki nuqtaviy zaryad maydoni. Sinov zaryadi kuch chiziqlari bo‘ylab harakatlanadi.',
  sum:'Zaryadning saqlanishi, Kulon qonuni, maydon kuchlanganligi va superpozitsiya.',
  concepts:[
    {h:'Elektr zaryadi va uning saqlanishi', p:'Zaryad — jismlarning elektromagnit ta’sirlashuvini tavsiflovchi fizik kattalik. Eng kichik erkin zaryad elementar zaryad: e = 1,6·10⁻¹⁹ C. Har qanday zaryad shu qiymatga karrali: q = N·e. Yopiq (izolyatsiyalangan) sistemada zaryadlarning algebraik yig‘indisi o‘zgarmaydi — bu zaryadning saqlanish qonuni. Elektrlashda zaryad yo‘qdan paydo bo‘lmaydi, faqat bir jismdan ikkinchisiga ko‘chadi.'},
    {h:'Kulon qonuni', p:'Vakuumdagi ikki nuqtaviy zaryad orasidagi ta’sir kuchi zaryadlar ko‘paytmasiga to‘g‘ri, oralaridagi masofa kvadratiga teskari proporsional. Kuch zaryadlarni tutashtiruvchi to‘g‘ri chiziq bo‘ylab yo‘nalgan: bir xil ishorali zaryadlar itaradi, har xil ishorali zaryadlar tortishadi. Muhitda kuch ε marta kamayadi.'},
    {h:'Elektr maydon kuchlanganligi', p:'Maydonning kuch tavsifi — kuchlanganlik: maydonning berilgan nuqtasiga qo‘yilgan sinov zaryadiga ta’sir etuvchi kuchning shu zaryadga nisbati. Bu vektor kattalik, birligi N/C yoki V/m. Musbat zaryad maydonida E vektori zaryaddan tashqariga, manfiy zaryad maydonida zaryadga qarab yo‘nalgan.'},
    {h:'Kuch chiziqlari va superpozitsiya', p:'Kuch chiziqlari — har bir nuqtasidagi urinma E vektori yo‘nalishi bilan mos tushadigan chiziqlar. Ular musbat zaryadda boshlanib manfiy zaryadda tugaydi, kesishmaydi; zichligi maydon kuchliligini ko‘rsatadi. Bir necha zaryad maydoni superpozitsiya prinsipi bo‘yicha qo‘shiladi: E = E₁ + E₂ + … (vektorlar yig‘indisi).'}
  ],
  formulas:[
    {n:'Kulon qonuni', f:'F = k · |q<sub>1</sub>·q<sub>2</sub>| / (ε·r<sup>2</sup>),&nbsp; k = 9·10<sup>9</sup> N·m²/C²'},
    {n:'Maydon kuchlanganligi', f:'E = F / q<sub>0</sub>&nbsp;&nbsp;[N/C = V/m]'},
    {n:'Nuqtaviy zaryad maydoni', f:'E = k·|q| / (ε·r<sup>2</sup>)'},
    {n:'Superpozitsiya', f:'E⃗ = E⃗<sub>1</sub> + E⃗<sub>2</sub> + … + E⃗<sub>n</sub>'}
  ],
  terms:[
    {t:'Elementar zaryad', d:'e = 1,6·10⁻¹⁹ C — eng kichik ajralmas zaryad.'},
    {t:'Dielektrik singdiruvchanlik ε', d:'Muhit maydonni necha marta susaytirishini ko‘rsatadi. Vakuum uchun ε = 1.'},
    {t:'Bir jinsli maydon', d:'Hamma nuqtasida E bir xil bo‘lgan maydon; chiziqlari parallel va teng zichlikda.'}
  ]
},
{
  id:2, sec:'elektr', title:'Elektr maydon potensiali va energiyasi', viz:'potential',
  vizcap:'Ekvipotensial sirtlar (halqalar) va kuch chiziqlari. Zaryadning ko‘chish ishi yo‘lga bog‘liq emas.',
  sum:'Maydon ishi, potensial va kuchlanish, ekvipotensial sirtlar, E va U bog‘lanishi.',
  concepts:[
    {h:'Maydon kuchlarining ishi', p:'Elektrostatik maydonda zaryadni ko‘chirishda bajarilgan ish yo‘lning shakliga bog‘liq emas, faqat boshlang‘ich va oxirgi nuqtalar vaziyatiga bog‘liq. Berk kontur bo‘ylab ish nolga teng — shu sababli elektrostatik maydon potensial (konservativ) maydon deyiladi.'},
    {h:'Potensial va potensiallar farqi', p:'Potensial — maydonning energetik tavsifi: zaryadning potensial energiyasining shu zaryadga nisbati, φ = W/q. Birligi volt (V). Ikki nuqta potensiallari farqi kuchlanish deyiladi: U = φ₁ − φ₂ = A/q. Potensial skalyar kattalik, shuning uchun bir necha zaryad potensiali oddiy algebraik qo‘shiladi.'},
    {h:'Ekvipotensial sirtlar', p:'Barcha nuqtalarida potensial bir xil bo‘lgan sirt ekvipotensial sirt deyiladi. Bunday sirt bo‘ylab zaryadni ko‘chirishda ish bajarilmaydi, chunki U = 0. Ekvipotensial sirtlar kuch chiziqlariga har doim perpendikulyar; nuqtaviy zaryad uchun ular konsentrik sferalar, bir jinsli maydonda esa parallel tekisliklar.'},
    {h:'E va U orasidagi bog‘lanish', p:'Bir jinsli maydonda kuchlanganlik kuchlanishning masofaga nisbatiga teng: E = U/d. Shu sababli kuchlanganlikni V/m da ifodalash mumkin. Formula kondensator ichidagi maydonni, elektronning tezlanishini va ko‘plab amaliy hisoblarni tez bajarishga imkon beradi.'}
  ],
  formulas:[
    {n:'Maydon ishi', f:'A = q·(φ<sub>1</sub> − φ<sub>2</sub>) = q·U'},
    {n:'Potensial', f:'φ = W / q,&nbsp;&nbsp; nuqtaviy zaryad: φ = k·q / (ε·r)'},
    {n:'Bir jinsli maydon', f:'E = U / d&nbsp;&nbsp;⇒&nbsp;&nbsp;U = E·d'},
    {n:'Tezlanish ishi', f:'q·U = m·v<sup>2</sup>/2&nbsp;&nbsp;(boshlang‘ich tezlik nol bo‘lsa)'}
  ],
  terms:[
    {t:'Volt', d:'1 V — 1 C zaryadni ko‘chirishda 1 J ish bajariladigan potensiallar farqi.'},
    {t:'Elektronvolt', d:'1 eV = 1,6·10⁻¹⁹ J — elektronning 1 V kuchlanishda oladigan energiyasi.'},
    {t:'Potensial maydon', d:'Berk kontur bo‘ylab ishi nolga teng maydon.'}
  ]
},
{
  id:3, sec:'elektr', title:'Moddalarda elektr maydon. Elektr sig‘imi', viz:'capacitor',
  vizcap:'Yassi kondensator: dielektrik kiritilganda maydon susayadi, sig‘im ortadi.',
  sum:'O‘tkazgich va dielektrik maydonda, sig‘im, kondensatorlarni ulash, energiya.',
  concepts:[
    {h:'O‘tkazgich maydonda', p:'O‘tkazgichda erkin zaryad tashuvchilar bor. Tashqi maydonda ular siljib, o‘tkazgich ichida tashqi maydonni to‘liq kompensatsiya qiladigan maydon vujudga keltiradi — natijada o‘tkazgich ichida E = 0, butun hajm bir xil potensialga ega bo‘ladi. Ortiqcha zaryad faqat sirtda, eng kuchli qism o‘tkir uchlarda to‘planadi. Shu hodisa elektrostatik ekranlash (Faradey qafasi) asosida yotadi.'},
    {h:'Dielektrik va qutblanish', p:'Dielektrikda erkin zaryadlar yo‘q, lekin molekulalar maydonda qutblanadi (yo‘naladi). Qutblanish natijasida ichki maydon tashqi maydonga qarama-qarshi yo‘nalib, uni ε marta susaytiradi: E = E₀/ε. Dielektrik singdiruvchanlik ε — moddaning xarakteristikasi (havo ≈ 1, suv ≈ 81, shisha ≈ 7).'},
    {h:'Elektr sig‘imi va kondensator', p:'Sig‘im — o‘tkazgich zaryadining potensialiga nisbati: C = q/φ. Birligi farad (F), amalda pF, nF, μF ishlatiladi. Kondensator — dielektrik bilan ajratilgan ikki o‘tkazgich; uning sig‘imi C = q/U. Yassi kondensator sig‘imi plastinka yuzasiga va ε ga to‘g‘ri, oraliq masofasiga teskari proporsional.'},
    {h:'Ulash usullari va energiya', p:'Parallel ulashda kuchlanish bir xil, sig‘imlar qo‘shiladi: C = C₁+C₂+… Ketma-ket ulashda zaryad bir xil, teskari sig‘imlar qo‘shiladi: 1/C = 1/C₁+1/C₂+… Zaryadlangan kondensator maydonida energiya saqlanadi: W = CU²/2 = qU/2 = q²/(2C). Bu energiya fotoapparat chaqnog‘i, defibrillyator va impuls qurilmalarida ishlatiladi.'}
  ],
  formulas:[
    {n:'Sig‘im', f:'C = q / U&nbsp;&nbsp;[F]'},
    {n:'Yassi kondensator', f:'C = ε·ε<sub>0</sub>·S / d,&nbsp; ε<sub>0</sub> = 8,85·10<sup>−12</sup> F/m'},
    {n:'Parallel / ketma-ket', f:'C<sub>par</sub> = ΣC<sub>i</sub>&nbsp;&nbsp;|&nbsp;&nbsp;1/C<sub>ket</sub> = Σ(1/C<sub>i</sub>)'},
    {n:'Energiya', f:'W = C·U<sup>2</sup>/2 = q·U/2 = q<sup>2</sup>/(2C)'}
  ],
  terms:[
    {t:'Farad', d:'1 F — 1 V kuchlanishda 1 C zaryad to‘playdigan sig‘im (juda katta birlik).'},
    {t:'Elektrostatik ekranlash', d:'O‘tkazgich qobiq ichini tashqi maydondan himoyalashi.'},
    {t:'Teshilish kuchlanishi', d:'Dielektrik o‘tkazgichga aylanadigan eng kichik kuchlanish.'}
  ]
},
{
  id:4, sec:'elektr', title:'O‘zgarmas elektr toki', viz:'current',
  vizcap:'O‘tkazgichdagi elektronlar dreyfi. Kuchlanish oshsa dreyf tezligi va tok kuchi ortadi.',
  sum:'Tok kuchi va zichligi, qarshilik, Om qonuni, o‘tkazgichlarni ulash, harorat ta’siri.',
  concepts:[
    {h:'Tok kuchi va tok zichligi', p:'Elektr toki — zaryadlangan zarrachalarning tartibli harakati. Tok kuchi — o‘tkazgich ko‘ndalang kesimidan vaqt birligida o‘tgan zaryad: I = q/t. Birligi amper (A). Tok zichligi j = I/S kesim birligiga to‘g‘ri keladigan tokni ko‘rsatadi va o‘tkazgich qizishini baholashda ishlatiladi. Metallda elektronlar dreyf tezligi juda kichik (mm/s), lekin maydon deyarli yorug‘lik tezligida tarqaladi.'},
    {h:'Qarshilik', p:'Qarshilik o‘tkazgichning tokka ko‘rsatgan to‘sqinligi: R = ρ·l/S. Bu yerda ρ — solishtirma qarshilik (modda tabiatiga bog‘liq), l — uzunlik, S — kesim yuzasi. Birligi om (Ω). Uzunlik ikki marta oshsa qarshilik ikki marta ortadi, kesim ikki marta oshsa ikki marta kamayadi.'},
    {h:'Zanjir qismi uchun Om qonuni', p:'Zanjir qismidagi tok kuchi kuchlanishga to‘g‘ri, qarshilikka teskari proporsional: I = U/R. Metall o‘tkazgich uchun volt-amper xarakteristikasi to‘g‘ri chiziq — bunday elementlar chiziqli deyiladi. Lampa cho‘g‘lanma simi yoki yarimo‘tkazgich diod uchun VAX egri chiziq bo‘ladi.'},
    {h:'Ulash usullari va harorat', p:'Ketma-ket ulashda tok bir xil, qarshiliklar qo‘shiladi: R = R₁+R₂+…, kuchlanish qarshilikka proporsional taqsimlanadi. Parallel ulashda kuchlanish bir xil, teskari qarshiliklar qo‘shiladi: 1/R = 1/R₁+1/R₂+…, umumiy qarshilik eng kichik qarshilikdan ham kichik bo‘ladi. Metallarda harorat ortsa qarshilik ortadi: R = R₀(1 + α·Δt); yarimo‘tkazgichlarda esa, aksincha, kamayadi.'}
  ],
  formulas:[
    {n:'Tok kuchi', f:'I = q / t = n·e·S·v<sub>dreyf</sub>&nbsp;&nbsp;[A]'},
    {n:'Om qonuni (qism)', f:'I = U / R&nbsp;&nbsp;⇒&nbsp;&nbsp;U = I·R'},
    {n:'Qarshilik', f:'R = ρ·l / S'},
    {n:'Ulash', f:'R<sub>ket</sub> = ΣR<sub>i</sub>&nbsp;&nbsp;|&nbsp;&nbsp;1/R<sub>par</sub> = Σ(1/R<sub>i</sub>)'},
    {n:'Harorat bog‘liqligi', f:'R = R<sub>0</sub>·(1 + α·Δt)'}
  ],
  terms:[
    {t:'Amper', d:'1 A — 1 s da 1 C zaryad o‘tadigan tok.'},
    {t:'Solishtirma qarshilik ρ', d:'Mis uchun 1,7·10⁻⁸ Ω·m, nixrom uchun ≈1,1·10⁻⁶ Ω·m.'},
    {t:'VAX', d:'Volt-amper xarakteristikasi — I(U) grafigi.'}
  ]
},
{
  id:5, sec:'elektr', title:'To‘liq zanjir uchun Om qonuni. Tokning ishi va quvvati', viz:'emf',
  vizcap:'EYuK manbai ichki qarshilik bilan. Tashqi qarshilik o‘zgarsa foydali quvvat qanday o‘zgaradi.',
  sum:'EYuK, ichki qarshilik, Joul–Lens qonuni, manbalarni ulash, Kirxgof qoidalari, FIK.',
  concepts:[
    {h:'Elektr yurituvchi kuch', p:'Manbada zaryadlarni ko‘chirish uchun nomelektr (kimyoviy, mexanik) kuchlar ishlaydi. EYuK — shu nomelektr kuchlarning ishining ko‘chirilgan zaryadga nisbati: ε = A_nomel/q. Birligi volt. Har bir manba ichki qarshilik r ga ham ega — bu manbaning o‘zidagi energiya yo‘qotishini belgilaydi.'},
    {h:'To‘liq zanjir uchun Om qonuni', p:'Yopiq zanjirdagi tok kuchi EYuK ni to‘liq qarshilikka (tashqi + ichki) bo‘lishga teng: I = ε/(R+r). Qisqa tutashuvda (R→0) tok maksimal bo‘ladi: I_qt = ε/r. Manba qisqichlaridagi kuchlanish U = ε − I·r, ya’ni tok ortsa qisqich kuchlanishi kamayadi.'},
    {h:'Tokning ishi, quvvati, Joul–Lens qonuni', p:'Tokning ishi A = U·I·t, quvvati P = U·I = I²R = U²/R. Qarshilikda ajralgan issiqlik Joul–Lens qonuni bilan hisoblanadi: Q = I²·R·t. Shu sababli uzatish liniyalarida yo‘qotishni kamaytirish uchun tokni kichik, kuchlanishni katta qilib uzatiladi.'},
    {h:'Kirxgof qoidalari va FIK', p:'Birinchi qoida: tugunga kelgan toklar yig‘indisi undan ketgan toklar yig‘indisiga teng (ΣI = 0). Ikkinchi qoida: berk kontur bo‘ylab kuchlanish tushishlari yig‘indisi EYuK lar yig‘indisiga teng (ΣI·R = Σε). Manbaning FIK si foydali quvvatning to‘liq quvvatga nisbati: η = R/(R+r). Maksimal foydali quvvat R = r shartida, lekin bunda η faqat 50% bo‘ladi.'}
  ],
  formulas:[
    {n:'To‘liq zanjir', f:'I = ε / (R + r)'},
    {n:'Qisqich kuchlanishi', f:'U = ε − I·r'},
    {n:'Quvvat', f:'P = U·I = I<sup>2</sup>·R = U<sup>2</sup>/R'},
    {n:'Joul–Lens', f:'Q = I<sup>2</sup>·R·t'},
    {n:'FIK', f:'η = R/(R+r) = U/ε'}
  ],
  terms:[
    {t:'Qisqa tutashuv', d:'R ≈ 0 holat; tok I = ε/r gacha o‘sadi.'},
    {t:'Manbalarni ketma-ket ulash', d:'ε = n·ε₁, r = n·r₁ — kuchlanish ortadi.'},
    {t:'Manbalarni parallel ulash', d:'ε = ε₁, r = r₁/n — uzoqroq ishlaydi.'}
  ]
},
{
  id:6, sec:'elektr', title:'Turli muhitlarda elektr toki', viz:'semicon',
  vizcap:'p–n o‘tish: to‘g‘ri ulashda tok o‘tadi, teskari ulashda to‘siq qatlami kengayadi.',
  sum:'Metallar, elektrolitlar (Faradey), gazlar, vakuum, yarimo‘tkazgichlar; diod va tranzistor.',
  concepts:[
    {h:'Metallar va elektrolitlar', p:'Metallda tok tashuvchi — erkin elektronlar; ularning dreyfi modda ko‘chishiga olib kelmaydi. Elektrolitda tok tashuvchi — ionlar (musbat va manfiy), shu sababli tok bilan birga modda ham ko‘chadi — elektroliz hodisasi. Faradeyning birinchi qonuni: elektrodda ajralgan modda massasi o‘tgan zaryadga proporsional, m = k·I·t.'},
    {h:'Gazlar va vakuumdagi tok', p:'Oddiy sharoitda gaz dielektrik; tok o‘tishi uchun ionizator kerak — bu nomustaqil razryad. Kuchlanish yetarlicha katta bo‘lsa zarbiy ionizatsiya boshlanadi va razryad mustaqil bo‘ladi (uchqun, yoy, toj, tlovushi razryad). Vakuumda tok tashuvchi yo‘q; termoelektron emissiya yo‘li bilan qizdirilgan katoddan elektron chiqariladi — vakuum diodi, elektron nur trubkasi shu asosda ishlaydi.'},
    {h:'Yarimo‘tkazgichlar', p:'Yarimo‘tkazgichlarda o‘tkazuvchanlik haroratga va aralashmaga juda sezgir. Xususiy o‘tkazuvchanlikda elektron–kovak juftligi hosil bo‘ladi. Donor aralashma n-tipli (asosiy tashuvchi — elektron), akseptor aralashma p-tipli (asosiy tashuvchi — kovak) yarimo‘tkazgich beradi. Harorat ortishi bilan tashuvchilar soni ortadi, shuning uchun qarshilik kamayadi — termistor shunga asoslangan.'},
    {h:'p–n o‘tish, diod va tranzistor', p:'p va n sohalar chegarasida to‘siq qatlami yuzaga keladi. To‘g‘ri ulashda (p ga «+») to‘siq pasayadi va tok o‘tadi; teskari ulashda to‘siq kengayadi va tok amalda nolga teng — bu diodning bir tomonlama o‘tkazuvchanligi, to‘g‘rilagichlar asosi. Uch sohali tuzilma (n–p–n yoki p–n–p) tranzistor bo‘lib, kichik baza toki bilan katta kollektor tokini boshqaradi — kuchaytirish va kalit vazifasi.'}
  ],
  formulas:[
    {n:'Faradeyning I qonuni', f:'m = k·q = k·I·t'},
    {n:'Faradeyning II qonuni', f:'k = M / (F·n),&nbsp; F = 96500 C/mol'},
    {n:'Birlashgan shakl', f:'m = (M / (F·n))·I·t'},
    {n:'Termistor', f:'R haroratga teskari — t↑ ⇒ R↓'}
  ],
  terms:[
    {t:'Elektrokimyoviy ekvivalent k', d:'1 C zaryad o‘tganda ajraladigan modda massasi.'},
    {t:'Faradey soni', d:'F = 96500 C/mol — 1 mol bir valentli ionni ajratish uchun zaryad.'},
    {t:'Kovak', d:'Elektron bo‘sh qoldirgan joy; musbat zaryad tashuvchi sifatida harakatlanadi.'}
  ]
},
{
  id:7, sec:'magnet', title:'Magnit maydon. Amper kuchi', viz:'bfield',
  vizcap:'Tokli o‘tkazgich atrofidagi magnit maydon va magnit maydonda unga ta’sir etuvchi Amper kuchi.',
  sum:'Magnit maydon manbalari, induksiya B, to‘g‘ri tok/halqa/solenoid maydoni, Amper kuchi, dvigatel.',
  concepts:[
    {h:'Magnit maydon va induksiya', p:'Magnit maydon harakatlanuvchi zaryadlar (tok) va doimiy magnitlar atrofida vujudga keladi va faqat harakatlanuvchi zaryadlarga ta’sir qiladi. Maydonning kuch tavsifi — magnit induksiya B, birligi tesla (T). Magnit maydon chiziqlari berk (boshlanishi va oxiri yo‘q) — maydon uyurmaviy. Yo‘nalish o‘ng qo‘l (burg‘i) qoidasi bilan topiladi.'},
    {h:'Tokli o‘tkazgichlar maydoni', p:'To‘g‘ri tok maydoni o‘tkazgichdan uzoqlashgan sari kamayadi: B = μ₀I/(2πr) — chiziqlar konsentrik aylanalar. Halqa markazida B = μ₀I/(2R). Solenoid ichida maydon bir jinsli: B = μ₀·n·I, bunda n = N/l — birlik uzunlikdagi o‘ramlar soni. O‘zak kiritilsa maydon μ marta kuchayadi.'},
    {h:'Amper kuchi', p:'Magnit maydonda tokli o‘tkazgichga ta’sir etuvchi kuch: F = B·I·l·sinα, bunda α — B va tok yo‘nalishi orasidagi burchak. Kuch maydon va tokka perpendikulyar, yo‘nalishi chap qo‘l qoidasi bilan aniqlanadi. Tok maydonga parallel bo‘lsa (α = 0) kuch nolga teng, perpendikulyar bo‘lsa maksimal.'},
    {h:'Amaliy qo‘llanishi', p:'Amper kuchi elektr dvigatel asosida yotadi: ramka magnit maydonda aylantiruvchi moment oladi, kollektor har yarim aylanada tok yo‘nalishini o‘zgartirib aylanishni davom ettiradi. Shuningdek u elektromagnit o‘lchov asboblari (ampermetr, voltmetr), dinamik va magnit-levitatsiya qurilmalarida ishlatiladi.'}
  ],
  formulas:[
    {n:'Amper kuchi', f:'F = B·I·l·sinα&nbsp;&nbsp;[N]'},
    {n:'To‘g‘ri tok maydoni', f:'B = μ<sub>0</sub>·I / (2π·r),&nbsp; μ<sub>0</sub> = 4π·10<sup>−7</sup> T·m/A'},
    {n:'Halqa markazida', f:'B = μ<sub>0</sub>·I / (2R)'},
    {n:'Solenoid ichida', f:'B = μ<sub>0</sub>·μ·n·I,&nbsp; n = N/l'}
  ],
  terms:[
    {t:'Tesla', d:'1 T — 1 m uzunlikdagi 1 A tokli o‘tkazgichga 1 N kuch bilan ta’sir etuvchi maydon.'},
    {t:'Chap qo‘l qoidasi', d:'B kafta ichiga kirsa, 4 barmoq tok yo‘nalishi bo‘ylab, bosh barmoq kuchni ko‘rsatadi.'},
    {t:'Aylantiruvchi moment', d:'M = B·I·S·N·sinα — ramkaga ta’sir etuvchi moment.'}
  ]
},
{
  id:8, sec:'magnet', title:'Lorens kuchi va moddalarning magnit xossalari', viz:'lorentz',
  vizcap:'Magnit maydonga kirgan zaryadli zarracha aylana bo‘ylab harakatlanadi. B va v o‘zgarsa radius o‘zgaradi.',
  sum:'Zarracha harakati, massa-spektrograf, siklotron, dia-, para- va ferromagnetiklar.',
  concepts:[
    {h:'Lorens kuchi', p:'Magnit maydonda harakatlanuvchi zaryadga ta’sir etuvchi kuch: F = q·v·B·sinα. Kuch har doim tezlikka perpendikulyar, shu sababli ish bajarmaydi va zarracha tezligining moduli o‘zgarmaydi — faqat yo‘nalishi o‘zgaradi. Yo‘nalish chap qo‘l qoidasi bilan topiladi (manfiy zaryad uchun teskari).'},
    {h:'Zarrachaning maydondagi harakati', p:'Tezlik B ga perpendikulyar bo‘lsa, zarracha radiusi r = m·v/(q·B) bo‘lgan aylana bo‘ylab harakatlanadi. Aylanish davri T = 2πm/(qB) tezlikka bog‘liq emas — siklotron shunga asoslangan. Tezlik maydonga burchak ostida bo‘lsa, traektoriya vint chizig‘i bo‘ladi; maydonga parallel bo‘lsa kuch nolga teng va harakat to‘g‘ri chiziqli qoladi.'},
    {h:'Amaliy qurilmalar', p:'Massa-spektrografda ionlar bir xil kuchlanishda tezlatilib magnit maydonga kiritiladi; r = m·v/(qB) bo‘lganidan ionlar massasiga ko‘ra ajraladi — izotoplarni aniqlash usuli. Siklotronda zarracha spiral bo‘ylab tezlashadi. Yer magnit maydoni kosmik zarrachalarni og‘diradi va qutb yog‘dusini vujudga keltiradi; Xoll effekti maydonni o‘lchashga imkon beradi.'},
    {h:'Moddalarning magnit xossalari', p:'Magnit singdiruvchanlik μ ga ko‘ra moddalar uch guruhga bo‘linadi. Diamagnetiklar (mis, suv, vismut) maydonni bir oz susaytiradi, μ < 1. Paramagnetiklar (alyuminiy, kislorod) bir oz kuchaytiradi, μ > 1. Ferromagnetiklar (temir, nikel, kobalt) maydonni minglab marta kuchaytiradi, qoldiq magnitlanishga ega va Kyuri nuqtasidan yuqori haroratda bu xossani yo‘qotadi.'}
  ],
  formulas:[
    {n:'Lorens kuchi', f:'F = q·v·B·sinα'},
    {n:'Aylana radiusi', f:'r = m·v / (q·B)'},
    {n:'Aylanish davri', f:'T = 2π·m / (q·B)&nbsp;&nbsp;(v ga bog‘liq emas)'},
    {n:'Tezlatish', f:'q·U = m·v<sup>2</sup>/2&nbsp;&nbsp;⇒&nbsp;&nbsp;v = √(2qU/m)'}
  ],
  terms:[
    {t:'Kyuri nuqtasi', d:'Ferromagnetik magnit xossasini yo‘qotadigan harorat (temir uchun 770 °C).'},
    {t:'Vint chizig‘i', d:'Tezlik maydonga burchak ostida bo‘lganda hosil bo‘ladigan traektoriya.'},
    {t:'Magnit singdiruvchanlik μ', d:'Modda maydonni necha marta o‘zgartirishini ko‘rsatadi.'}
  ]
},
{
  id:9, sec:'magnet', title:'Elektromagnit induksiya', viz:'induction',
  vizcap:'Magnit g‘altak ichida harakatlanganda induksiya toki paydo bo‘ladi; yo‘nalish Lens qoidasiga mos.',
  sum:'Faradey tajribalari, magnit oqimi, induksiya qonuni, Lens qoidasi, harakatlanuvchi o‘tkazgich.',
  concepts:[
    {h:'Faradey tajribalari va magnit oqimi', p:'Faradey yopiq konturni kesib o‘tuvchi magnit oqimi o‘zgarganda konturda tok paydo bo‘lishini aniqladi. Magnit oqimi Φ = B·S·cosα, birligi veber (Wb). Oqimni uch yo‘l bilan o‘zgartirish mumkin: B ni, S ni yoki kontur burilish burchagini o‘zgartirish. Muhim shart — oqim o‘zgarishi tezligi, oqimning o‘zi emas.'},
    {h:'Elektromagnit induksiya qonuni', p:'Konturdagi induksiya EYuK magnit oqimining o‘zgarish tezligiga teng va ishorasi qarama-qarshi: ε = −ΔΦ/Δt. N o‘ramli g‘altak uchun ε = −N·ΔΦ/Δt. Minus ishora Lens qoidasini ifodalaydi va energiyaning saqlanish qonunidan kelib chiqadi.'},
    {h:'Lens qoidasi', p:'Induksiya toki shunday yo‘nalishda oqadi-ki, uning magnit maydoni o‘zini vujudga keltirgan oqim o‘zgarishiga qarshilik qiladi. Oqim ortsa induksiya toki maydoni unga teskari, kamaysa — bir yo‘nalishda bo‘ladi. Shu sababli magnitni g‘altakka yaqinlashtirishda qarshilik kuchi seziladi va mexanik ish elektr energiyaga aylanadi.'},
    {h:'Harakatlanuvchi o‘tkazgichda EYuK', p:'Magnit maydonda v tezlik bilan harakatlanayotgan l uzunlikdagi o‘tkazgichda EYuK ε = B·l·v·sinα hosil bo‘ladi. Bu generator ishlashining asosi: ramka bir tekis aylanganda sinusoidal EYuK yuzaga keladi. Induksiya hodisasi transformator, induksion plita, elektromagnit tormoz va kartochkali o‘quvchilarda qo‘llanadi.'}
  ],
  formulas:[
    {n:'Magnit oqimi', f:'Φ = B·S·cosα&nbsp;&nbsp;[Wb]'},
    {n:'Induksiya qonuni', f:'ε = −ΔΦ/Δt;&nbsp; g‘altak uchun ε = −N·ΔΦ/Δt'},
    {n:'Harakatlanuvchi o‘tkazgich', f:'ε = B·l·v·sinα'},
    {n:'Induksiya toki', f:'I = ε / (R + r)'}
  ],
  terms:[
    {t:'Veber', d:'1 Wb — 1 s da bir tekis nolga kamayganda 1 V EYuK beradigan oqim.'},
    {t:'Uyurmaviy toklar', d:'Massiv o‘tkazgich ichida hosil bo‘ladigan berk toklar (Fuko toklari).'},
    {t:'Lens qoidasi', d:'Induksiya toki sababni «qo‘llab-quvvatlamaydi», balki unga qarshilik qiladi.'}
  ]
},
{
  id:10, sec:'magnet', title:'O‘zinduksiya va magnit maydon energiyasi', viz:'selfind',
  vizcap:'G‘altakda tok o‘zgarganda o‘zinduksiya EYuK paydo bo‘ladi va tokning o‘sishini sekinlashtiradi.',
  sum:'Uyurmaviy elektr maydon, o‘zinduksiya EYuK, induktivlik, g‘altak magnit maydoni energiyasi.',
  concepts:[
    {h:'Uyurmaviy elektr maydon', p:'Maksvell g‘oyasiga ko‘ra o‘zgaruvchan magnit maydon atrofida uyurmaviy elektr maydon vujudga keladi. Bu maydonning kuch chiziqlari berk, u o‘tkazgich bo‘lmasa ham mavjud. Aynan shu maydon konturdagi erkin zaryadlarni harakatga keltirib induksiya tokini vujudga keltiradi.'},
    {h:'O‘zinduksiya', p:'O‘tkazgichdagi tok o‘zgarsa, u o‘zi vujudga keltirgan oqim ham o‘zgaradi va o‘sha konturda EYuK hosil bo‘ladi — o‘zinduksiya hodisasi. Lens qoidasiga ko‘ra u tokning o‘zgarishiga qarshilik qiladi: zanjir ulanganda tok sekin o‘sadi, uzilganda esa uchqun paydo bo‘ladi, chunki tok bir zumda yo‘qolmaydi.'},
    {h:'Induktivlik', p:'Kontur magnit oqimi tokka proporsional: Φ = L·I, bunda L — induktivlik, birligi genri (H). U faqat kontur shakliga, o‘lchamiga va o‘zakka bog‘liq. Solenoid uchun L = μ₀·μ·n²·V. O‘zinduksiya EYuK: ε = −L·ΔI/Δt — tok tez o‘zgarsa EYuK katta bo‘ladi.'},
    {h:'Magnit maydon energiyasi', p:'Tokli g‘altak magnit maydonida energiya saqlanadi: W = L·I²/2. Bu energiya manba hisobidan tok o‘sish paytida to‘planadi va zanjir uzilganda qaytib beriladi. Shu sababli induktiv zanjirni uzish paytida uchqun va yuqori kuchlanish hosil bo‘ladi — bu xossa impuls transformatori va alangalanish tizimida ishlatiladi.'}
  ],
  formulas:[
    {n:'Induktivlik', f:'L = Φ / I&nbsp;&nbsp;[H]'},
    {n:'O‘zinduksiya EYuK', f:'ε = −L·ΔI/Δt'},
    {n:'Magnit maydon energiyasi', f:'W = L·I<sup>2</sup> / 2'},
    {n:'Solenoid induktivligi', f:'L = μ<sub>0</sub>·μ·n<sup>2</sup>·V'}
  ],
  terms:[
    {t:'Genri', d:'1 H — tok 1 A/s tezlikda o‘zgarganda 1 V EYuK beradigan induktivlik.'},
    {t:'Zanjirni uzish uchquni', d:'W = LI²/2 energiyaning tez ajralishi natijasi.'},
    {t:'Drossel', d:'Katta induktivlikli g‘altak; o‘zgaruvchan tokni cheklaydi.'}
  ]
},
{
  id:11, sec:'tebranish', title:'Erkin va majburiy elektromagnit tebranishlar', viz:'lc',
  vizcap:'LC kontur: energiya kondensator elektr maydonidan g‘altak magnit maydoniga o‘tib turadi.',
  sum:'Tebranish konturi, Tomson formulasi, energiya aylanishi, so‘nuvchi tebranishlar, rezonans.',
  concepts:[
    {h:'Tebranish konturi', p:'Kondensator va g‘altakdan tashkil topgan zanjir tebranish konturi deyiladi. Zaryadlangan kondensator g‘altak orqali bo‘shala boshlaydi; tok magnit maydon vujudga keltiradi. Kondensator bo‘shaganda butun energiya magnit maydonga o‘tadi, keyin kondensator teskari qutblanish bilan qayta zaryadlanadi — erkin elektromagnit tebranishlar yuzaga keladi.'},
    {h:'Tomson formulasi', p:'Erkin tebranishlar davri konturning parametrlari bilan aniqlanadi: T = 2π√(LC). Chastota ν = 1/T, xususiy burchak chastotasi ω = 1/√(LC). L yoki C ni 4 marta oshirsak davr 2 marta ortadi. Zaryad va kuchlanish kosinus qonuni bo‘yicha, tok esa 90° (T/4) fazaga siljigan holda sinus qonuni bo‘yicha o‘zgaradi.'},
    {h:'Energiya aylanishi va so‘nish', p:'Ideal konturda to‘liq energiya saqlanadi: W = q²/(2C) + L·I²/2 = const. Haqiqiy konturda aktiv qarshilik bor, energiya issiqlikka aylanadi va amplituda eksponensial kamayadi — so‘nuvchi tebranishlar. So‘nishni qoplash uchun tashqi manbadan energiya kiritiladi (avtotebranish generatori).'},
    {h:'Majburiy tebranishlar va rezonans', p:'Konturga o‘zgaruvchan EYuK ulansa majburiy tebranishlar yuzaga keladi va ularning chastotasi tashqi EYuK chastotasiga teng bo‘ladi. Tashqi chastota xususiy chastotaga yaqinlashganda amplituda keskin ortadi — elektr rezonansi. Rezonans radiopriyomnikni sozlashda foydali, lekin kuch zanjirlarida xavfli yuqori kuchlanishga olib keladi.'}
  ],
  formulas:[
    {n:'Tomson formulasi', f:'T = 2π·√(L·C)'},

{id:2,m:3,sim:'capbank',title:'Kondensatorlarni ketma-ket va parallel ulashda umumiy sig‘imni aniqlash',

 theory:'Parallel ulashda plastinka yuzasi kattalashgandek bo‘ladi, shuning uchun sig‘imlar qo‘shiladi: C = C₁ + C₂. Ketma-ket ulashda zaryad bir xil, kuchlanishlar qo‘shiladi, shuning uchun 1/C = 1/C₁ + 1/C₂ va umumiy sig‘im har qaysi kondensator sig‘imidan kichik bo‘ladi. Sig‘imni o‘lchash uchun ma’lum kuchlanishda to‘plangan zaryad o‘lchanadi: C = q/U.',

{id:4,m:4,sim:'resnet',title:'O‘tkazgichlarni ketma-ket va parallel ulashni o‘rganish',

 theory:'Ketma-ket ulashda tok hamma joyda bir xil, kuchlanishlar qo‘shiladi va qarshiliklarga proporsional taqsimlanadi: U₁/U₂ = R₁/R₂. Parallel ulashda kuchlanish bir xil, toklar qo‘shiladi va qarshiliklarga teskari proporsional taqsimlanadi: I₁/I₂ = R₂/R₁. Umumiy qarshilik ketma-ket ulashda R₁+R₂, parallel ulashda R₁R₂/(R₁+R₂) ga teng.',

{id:6,m:5,sim:'emf',title:'Tok manbaining EYuK va ichki qarshiligini aniqlash',

let _tc = null;
function TC(){
  if(_tc) return _tc;
  const cs = getComputedStyle(document.documentElement);
  const g = function(n){ return cs.getPropertyValue(n).trim() || '#888'; };
  _tc = {bg:g('--bg'),panel:g('--panel'),panel2:g('--panel2'),panel3:g('--panel3'),
    line:g('--line'),line2:g('--line2'),fg:g('--fg'),fg2:g('--fg2'),fg3:g('--fg3'),
    volt:g('--volt'),amp:g('--amp'),mag:g('--mag'),ok:g('--ok'),warn:g('--warn'),bad:g('--bad')};
  return _tc;
}
function clearTC(){ _tc = null; }

function fitCanvas(cv){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if(cv._w !== w || cv._h !== h || cv._d !== dpr){
    cv.width = w*dpr; cv.height = h*dpr; cv._w = w; cv._h = h; cv._d = dpr;
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx:ctx, w:w, h:h};
}
function line(ctx,x1,y1,x2,y2,col,wd){
  ctx.strokeStyle=col; ctx.lineWidth=wd||2; ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function arrowHead(ctx,x,y,ang,size,col){
  ctx.fillStyle=col; ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.46); ctx.lineTo(-size,-size*0.46);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,col,wd,hs){
  line(ctx,x1,y1,x2,y2,col,wd||2);
  arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),hs||7,col);
}
function txt(ctx,s,x,y,col,size,align,bold){
  ctx.fillStyle=col; ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.font=(bold?'700 ':'500 ')+(size||12)+'px "JetBrains Mono", monospace';
  ctx.fillText(s,x,y);
}
function dot(ctx,x,y,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }
function ringAt(ctx,x,y,r,col,wd){ ctx.strokeStyle=col; ctx.lineWidth=wd||2; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.stroke(); }
function roundRect(ctx,x,y,w,h,r,fill,stroke,lw){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
         ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.5; ctx.stroke(); }
}
function grid(ctx,w,h,step,col){
  ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath();
  for(let x=step;x<w;x+=step){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,h); }
  for(let y=step;y<h;y+=step){ ctx.moveTo(0,y+.5); ctx.lineTo(w,y+.5); }
  ctx.stroke();
}
/* zig-zag qarshilik */
function resistor(ctx,x,y,w,hh,col){
  ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(x,y);
  const n=6, dx=w/n;
  for(let i=0;i<n;i++) ctx.lineTo(x+dx*(i+0.5), y + (i%2? hh : -hh));
  ctx.lineTo(x+w,y); ctx.stroke();
}
/* g'altak */
function coil(ctx,x,y,w,r,n,col,lw){
  ctx.strokeStyle=col; ctx.lineWidth=lw||2.4; const dx=w/n;
  for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x+dx*(i+0.5), y, Math.min(r,dx*0.62), Math.PI, 0); ctx.stroke(); }
  line(ctx,x,y,x,y,col,lw||2.4);
}
/* batareya */
function battery(ctx,x,y,col){
  line(ctx,x-4,y-13,x-4,y+13,col,3);
  line(ctx,x+4,y-7,x+4,y+7,col,3);
}
/* harakatlanuvchi elektronlar */
function flowDots(ctx,pts,phase,col,n,r){
  if(pts.length<2) return;
  let total=0; const seg=[];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    seg.push(d); total+=d;
  }
  for(let k=0;k<n;k++){
    let s=((k/n)+phase)%1; let d=s*total; let i=0;
    while(i<seg.length && d>seg[i]){ d-=seg[i]; i++; }
    if(i>=seg.length) i=seg.length-1;
    const t=seg[i]?d/seg[i]:0;
    const x=pts[i][0]+(pts[i+1][0]-pts[i][0])*t, y=pts[i][1]+(pts[i+1][1]-pts[i][1])*t;
    dot(ctx,x,y,r||3,col);
  }
}

<script>
/* ============ SIMULYATORLAR (1-qism) ============ */
const SIMS = {};

/* --- 1. Elektroskob --- */
SIMS.electroscope = {
  ctl:[{k:'q',lb:'Berilgan zaryad',u:'birlik',min:0,max:8,step:1,val:3}],
  sw:[{k:'mat',lb:'Ishqalangan tayoqcha',opts:['Ebonit (−)','Shisha (+)'],val:0},
      {k:'probe',lb:'Yaqinlashtirilgan zaryad',opts:['Yo‘q','Musbat','Manfiy'],val:0}],
  out:function(s){
    const k=0.12281, x=k*s.q*s.q;
    let ang = 80*x/(1+x);
    const neg = s.mat===0;
    let d=0;
    if(s.probe===1) d = neg? -6 : 6;
    if(s.probe===2) d = neg? 6 : -6;
    if(s.q>0) ang = Math.max(0, Math.min(80, ang + d));
    return {ang:ang, sign:neg?'−':'+'};
  },
  ro:function(s,o){ return [
    {l:'Burchak',v:o.ang.toFixed(0)+'°',c:'volt'},
    {l:'Zaryad belgisi',v:s.q>0?o.sign:'—',c:''},
    {l:'Zaryad moduli',v:s.q+' b.',c:'amp'}]; },
  cols:['q, birlik','Burchak, °','Belgi'],
  meas:function(s,o){ return [String(s.q), o.ang.toFixed(0), s.q>0?o.sign:'—']; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC(); const cx=w*0.5, top=h*0.16;
    grid(ctx,w,h,28,c.line+'44');
    // korpus
    roundRect(ctx,cx-62,top+58,124,h-top-92,10,c.panel2,c.line,1.5);
    txt(ctx,'ELEKTROSKOB',cx,h-20,c.fg3,10,'center');
    // sharcha va o'q
    line(ctx,cx,top+22,cx,top+78,c.fg2,3);
    dot(ctx,cx,top+14,13,s.q>0? c.volt : c.fg3);
    // yaproqchalar
    const a=o.ang*Math.PI/180, L=Math.min(78,h-top-130);
    const ox=cx, oy=top+80;
    [-1,1].forEach(function(sg){
      ctx.strokeStyle=s.q>0? c.amp : c.fg2; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(ox,oy);
      ctx.lineTo(ox+sg*Math.sin(a)*L, oy+Math.cos(a)*L); ctx.stroke();
    });
    ctx.lineCap='butt';
    // zaryad belgilari
    if(s.q>0){
      const n=Math.min(8,s.q);
      for(let i=0;i<n;i++){
        const ph=(t*0.5+i/n)%1, yy=oy+Math.cos(a)*L*(0.25+0.6*((i%3)/3));
        const sg=(i%2)?1:-1;
        txt(ctx,o.sign, ox+sg*Math.sin(a)*L*(0.3+0.6*((i%3)/3))+sg*7, yy, c.amp, 11,'center',true);
      }
    }
    // tayoqcha
    const px=w*0.16;
    roundRect(ctx,px-11,top+6,22,74,7,s.mat===0? '#2a2f3a' : 'rgba(150,200,220,.35)',c.line2,1.5);
    txt(ctx, s.mat===0?'EBONIT':'SHISHA', px, top+92, c.fg3, 9,'center');
    txt(ctx, s.mat===0?'−−−':'+++', px, top+16, s.mat===0? c.volt : c.amp, 12,'center',true);
    // probe
    if(s.probe>0){
      const qx=w-w*0.16;
      dot(ctx,qx,top+40,15, s.probe===1? c.amp : c.volt);
      txt(ctx, s.probe===1?'+':'−', qx, top+40, c.bg, 15,'center',true);
      txt(ctx,'sinov zaryadi',qx,top+68,c.fg3,9,'center');
      arrow(ctx,qx-22,top+40,cx+74,top+30,c.fg3,1.6,6);
    }
    txt(ctx,'θ = '+o.ang.toFixed(0)+'°',cx+86,oy+20,c.fg2,12,'left',true);

      line(ctx,bx,cy+52,bx,cy+13,c.fg2,2);
      txt(ctx,'KETMA-KET:  1/C = 1/C₁ + 1/C₂',w*0.5,22,c.amp,12,'center',true);
    }
    txt(ctx,'C = '+o.C.toFixed(2)+' μF',w*0.5,h-16,c.fg,13,'center',true);
  }
};
