<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elektr va Magnetizm Praktikumi</title>
<meta name="description" content="Elektr va magnetizm bo‘yicha o‘quv platformasi: 14 modul, 3 darajali testlar, Bilish–Qo‘llash–Mulohaza mashqlari va 14 laboratoriya simulyatori.">
<meta name="theme-color" content="#070B11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%2210%22 fill=%22%230E1620%22/%3E%3Cpath d=%22M11 29V17a9 9 0 0 1 18 0v12%22 stroke=%22%23FF5B8A%22 stroke-width=%223.4%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M11 29h5.2M23.8 29H29%22 stroke=%22%232BD9C9%22 stroke-width=%223.4%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: o‘lchov asbobi paneli — chapda rail, o‘ngda bitta ustunli ish maydoni;
   telefonda rail pastga tushadi. Ranglar fizika kodlari bilan: teal = maydon,
   amber = tok, rose = magnit. */
:root{
  --bg:#070B11; --panel:#0E1620; --panel2:#15202C; --panel3:#1C2936;
  --line:#243343; --line2:#31424f;
  --fg:#E8EFF6; --fg2:#9CAEC2; --fg3:#67788C;
  --volt:#2BD9C9; --amp:#FFA23A; --mag:#FF5B8A;
  --ok:#3DD68C; --warn:#F5C04A; --bad:#FF6B6B;
  --grid:rgba(43,217,201,.08);
  --shadow:0 18px 40px -22px rgba(0,0,0,.85);
  --radius:14px;
  --f-disp:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EFF4F8; --panel:#FFFFFF; --panel2:#E7EEF5; --panel3:#DBE6EF;
    --line:#CBD9E5; --line2:#B3C5D4;
    --fg:#0A141E; --fg2:#4B5F75; --fg3:#6B7F95;
    --volt:#0C8C82; --amp:#A85D06; --mag:#BE2A5E;
    --ok:#15803D; --warn:#92610A; --bad:#BE2A2A;
    --grid:rgba(12,140,130,.10);
    --shadow:0 14px 30px -20px rgba(16,40,64,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EFF4F8; --panel:#FFFFFF; --panel2:#E7EEF5; --panel3:#DBE6EF;
  --line:#CBD9E5; --line2:#B3C5D4;
  --fg:#0A141E; --fg2:#4B5F75; --fg3:#6B7F95;
  --volt:#0C8C82; --amp:#A85D06; --mag:#BE2A5E;
  --ok:#15803D; --warn:#92610A; --bad:#BE2A2A;
  --grid:rgba(12,140,130,.10);
  --shadow:0 14px 30px -20px rgba(16,40,64,.35);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:var(--volt)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:1fr;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding-block:10px;min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0;overflow:hidden}
.brand-txt b{font-family:var(--f-disp);font-size:15px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;color:var(--fg3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sp{flex:1;min-width:0}
@media (max-width:640px){ .brand-txt{display:none} .who input{width:88px} }
.who{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px}
.who label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--fg3);text-transform:uppercase}
.who input{width:104px;background:transparent;border:0;outline:none;font-size:14px;font-weight:600;padding:2px 4px;min-width:0}
.who input:focus-visible{outline:2px solid var(--volt);outline-offset:1px;border-radius:6px}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);flex:none}
.iconbtn:hover{border-color:var(--volt);color:var(--volt)}
.iconbtn:focus-visible{outline:2px solid var(--volt);outline-offset:2px}

/* progress ring */
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:700}

/* ---------- rail ---------- */
.rail{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;
  background:color-mix(in srgb,var(--panel) 95%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.navbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:8px 2px 7px;color:var(--fg3);border-top:2px solid transparent;margin-top:-1px}
.navbtn svg{width:21px;height:21px}
.navbtn span{font-size:10.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.navbtn.on{color:var(--volt);border-top-color:var(--volt)}
.navbtn:focus-visible{outline:2px solid var(--volt);outline-offset:-2px}

.main{padding-bottom:84px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 10px;max-width:1120px;margin:0 auto;width:100%}

@media (min-width:980px){
  .shell{grid-template-columns:236px 1fr}
  .topbar{grid-column:1/-1}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);left:auto;right:auto;bottom:auto;align-self:start;
    flex-direction:column;gap:4px;height:auto;border-top:0;border-right:1px solid var(--line);
    padding:18px 12px 24px;background:transparent;backdrop-filter:none}
  .navbtn{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;width:100%;
    padding:10px 12px;border-radius:11px;border-top:0;border-left:2px solid transparent;margin-top:0}
  .navbtn span{font-size:14px}
  .navbtn.on{background:var(--panel2);border-left-color:var(--volt)}
  .main{padding-bottom:40px;min-width:0}
  .wrap{padding-block:28px 40px}
}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--fg);
  border-radius:10px;padding:10px 16px;font-weight:600;font-size:14.5px;transition:.15s}
.btn:hover{border-color:var(--volt);color:var(--volt)}
.btn:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--volt);border-color:var(--volt);color:#04151a;font-weight:700}
.btn-main:hover{color:#04151a;filter:brightness(1.08)}
:root[data-theme="light"] .btn-main,
:root:not([data-theme="dark"]) .btn-main{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-main{color:#04151a}}
:root[data-theme="dark"] .btn-main{color:#04151a}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn-amp:hover{border-color:var(--amp);color:var(--amp)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.sep{height:1px;background:var(--line);border:0;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--fg2)}
.chip.volt{color:var(--volt);border-color:color-mix(in srgb,var(--volt) 42%,transparent);background:color-mix(in srgb,var(--volt) 12%,transparent)}
.chip.amp{color:var(--amp);border-color:color-mix(in srgb,var(--amp) 42%,transparent);background:color-mix(in srgb,var(--amp) 12%,transparent)}
.chip.mag{color:var(--mag);border-color:color-mix(in srgb,var(--mag) 42%,transparent);background:color-mix(in srgb,var(--mag) 12%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 42%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:clamp(24px,5vw,34px)}
.page-h p{color:var(--fg2);font-size:14.5px;max-width:62ch;margin-top:5px}

.bar{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--volt);transition:width .5s cubic-bezier(.2,.8,.2,1)}

.fml{font-family:var(--f-mono);font-size:15px;background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--volt);border-radius:8px;padding:9px 13px;display:block;overflow-x:auto;white-space:nowrap}
.fml sub,.fml sup{font-size:.72em}
.note{font-size:13.5px;color:var(--fg2)}

table.data{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
table.data th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding:7px 9px;border-bottom:1px solid var(--line)}
table.data td{padding:7px 9px;border-bottom:1px solid var(--line)}
table.data tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}

.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:5px;height:12px;border-radius:2px;background:var(--line2);display:block}
.lvl i.f{background:var(--amp)}

.fade{animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .fade,.pop{animation:none}
  *{transition-duration:.01ms !important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<style>
/* ---------- bosh sahifa ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(145deg,var(--panel) 0%,var(--panel2) 100%);padding:24px}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(120% 90% at 85% 10%,#000 10%,transparent 72%)}
.hero-in{position:relative;display:grid;gap:20px}
.hero h1{font-size:clamp(26px,6.2vw,42px);letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--volt)}
.hero p{color:var(--fg2);max-width:52ch;margin-top:9px;font-size:15px}
.hero-fx{height:140px;border-radius:12px;border:1px solid var(--line);background:var(--bg);overflow:hidden;position:relative}
.hero-fx canvas{display:block;width:100%;height:100%}
@media (min-width:860px){.hero{padding:30px 32px}.hero-in{grid-template-columns:1.05fr .95fr;align-items:center;gap:30px}.hero-fx{height:198px}}

.secgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(min(100%,228px),1fr))}
.seccard{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:11px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;transition:.18s}
.seccard:hover{border-color:var(--c,var(--volt));transform:translateY(-2px);box-shadow:var(--shadow)}
.seccard:focus-visible{outline:2px solid var(--c,var(--volt));outline-offset:2px}
.seccard-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c,var(--volt)) 14%,transparent);color:var(--c,var(--volt));flex:none}
.seccard-ic svg{width:22px;height:22px}
.seccard h3{font-size:17.5px}
.seccard p{font-size:13.5px;color:var(--fg2);flex:1}
.seccard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--fg3);letter-spacing:.05em}

/* o‘zlashtirish xaritasi */
.heat{display:grid;gap:5px;grid-template-columns:repeat(auto-fit,minmax(42px,1fr))}
.hcell{position:relative;aspect-ratio:1;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;
  font-weight:700;color:var(--fg3);transition:.18s}
.hcell:hover{transform:scale(1.08);z-index:2;border-color:var(--volt)}
.hcell:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.hcell[data-s="0"]{background:var(--panel2)}
.hcell[data-s="1"]{background:color-mix(in srgb,var(--bad) 30%,var(--panel2));color:var(--fg);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.hcell[data-s="2"]{background:color-mix(in srgb,var(--warn) 32%,var(--panel2));color:var(--fg);border-color:color-mix(in srgb,var(--warn) 48%,transparent)}
.hcell[data-s="3"]{background:color-mix(in srgb,var(--ok) 34%,var(--panel2));color:var(--fg);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.hcell[data-s="4"]{background:color-mix(in srgb,var(--ok) 62%,var(--panel2));color:#fff;border-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--fg3);font-family:var(--f-mono)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

.stat{display:grid;gap:3px}
.stat b{font-family:var(--f-mono);font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg3)}
.statrow{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}

/* ---------- modul ---------- */
.mlist{display:grid;gap:11px}
.mcard{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;transition:.16s;width:100%}
.mcard:hover{border-color:var(--volt);transform:translateX(3px)}
.mcard:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.mnum{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);
  font-weight:700;font-size:15px;background:var(--panel2);border:1px solid var(--line);color:var(--fg2)}
.mcard.done .mnum{background:color-mix(in srgb,var(--ok) 20%,transparent);border-color:var(--ok);color:var(--ok)}
.mcard h3{font-size:15.5px;font-family:var(--f-body);font-weight:650;letter-spacing:0}
.mcard p{font-size:12.5px;color:var(--fg3);margin-top:2px}
.secttl{display:flex;align-items:center;gap:11px;margin:24px 0 11px}
.secttl:first-child{margin-top:0}
.secttl h2{font-size:14px;letter-spacing:.11em;text-transform:uppercase;font-family:var(--f-mono);font-weight:500;color:var(--fg2);white-space:nowrap}
.secttl .ln{flex:1;height:1px;background:var(--line)}

.lesson{display:grid;gap:16px;max-width:860px}
.concept{border-left:2px solid var(--line);padding-left:15px}
.concept h4{font-size:16px;margin-bottom:5px;font-family:var(--f-body);font-weight:700}
.concept p{font-size:14.5px;color:var(--fg2)}
.concept + .concept{margin-top:14px}
.deff{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.deff .eyebrow{margin-bottom:6px;display:block}
.vizbox{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.vizbox canvas{display:block;width:100%;height:230px}
.vizcap{padding:9px 13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg3);background:var(--panel)}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg3);margin-bottom:12px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--volt);font-family:inherit;font-size:inherit}
.crumb button:hover{text-decoration:underline}

/* ---------- test / mashq ---------- */
.pickgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.pick{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;transition:.16s}
.pick:hover{border-color:var(--volt)}
.pick.on{border-color:var(--volt);background:color-mix(in srgb,var(--volt) 10%,var(--panel))}
.pick:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.pick b{display:block;font-size:14.5px;font-weight:650}
.pick small{display:block;color:var(--fg3);font-size:12px;margin-top:3px}

.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qhead .bar{flex:1;min-width:120px}
.qtext{font-size:17.5px;font-weight:600;line-height:1.45;font-family:var(--f-body)}
.opts{display:grid;gap:9px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:11px;align-items:start;text-align:left;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;transition:.14s;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--volt)}
.opt:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.opt i{font-family:var(--f-mono);font-weight:700;font-size:12.5px;width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line);font-style:normal;color:var(--fg3)}
.opt.sel{border-color:var(--volt);background:color-mix(in srgb,var(--volt) 11%,var(--panel2))}
.opt.sel i{background:var(--volt);color:#04151a;border-color:var(--volt)}

<style>
/* ---------- matematik terish ---------- */
.m{font-family:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;
   font-size:1.14em;line-height:1.5;white-space:nowrap;letter-spacing:0}

.msqrt>.mradbox>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}

/* formula qutisi */

  background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--volt);
  border-radius:8px;padding:11px 15px;display:block;overflow-x:auto;overflow-y:hidden}

<script>
/* ============ KICHIK MATEMATIK TERGICH ============
   Qo‘llab-quvvatlanadi: \frac{}{}  \sqrt{}  \vec{}  \abs{}  \text{}
   _{...} ^{...} (yoki bitta belgi), \, va \; — bo‘sh joy. */
(function(){
  const FN=['sin','cos','tg','ctg','ctg','arcsin','arccos','ln','lg','log','exp','const','max','min','sh','ch'];
  const UP_GREEK='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
  const LO_GREEK='αβγδεζηθικλμνξοπρστυφχψω';
  const OPS='=+−-±×<>≤≥≈≡⇒→';
  const TIGHT='·⋅';
  const RADSVG='<span class="mradbox"><svg viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="M0.5 58 L3.4 58 L6.6 95 L11.5 2.5" fill="none" stroke="currentColor" stroke-width="1.5" '+
    'vector-effect="non-scaling-stroke" stroke-linejoin="miter" stroke-linecap="round"/></svg></span>';
  function e(s){ return String(s).replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];}); }

  window.mathHTML = function(src){
    const s=String(src==null?'':src);
    let i=0;
    function grp(){
      if(s[i]!=='{') return atomOne();
      i++; const r=parse('}'); if(s[i]==='}') i++; return r;
    }
    function grpRaw(){
      if(s[i]!=='{') return '';
      i++; let out=''; let d=1;
      while(i<s.length){ if(s[i]==='{') d++; else if(s[i]==='}'){ d--; if(!d){ i++; break; } } out+=s[i++]; }
      return out;
    }
    function atomOne(){
      const ch=s[i]; if(ch===undefined) return '';
      i++;
      if(/[0-9]/.test(ch)) return '<span class="mn">'+ch+'</span>';
      if(/[A-Za-z]/.test(ch) || LO_GREEK.indexOf(ch)>=0) return '<span class="mv">'+e(ch)+'</span>';
      return '<span class="mn">'+e(ch)+'</span>';
    }
    function parse(stop){
      let out='';
      while(i<s.length){
        const ch=s[i];
        if(stop && ch===stop) return out;
        if(ch==='\\'){
          const mm=/^\\([a-zA-Z]+|,|;)/.exec(s.slice(i));
          if(!mm){ i++; continue; }
          const cmd=mm[1]; i+=mm[0].length;
          if(cmd==='frac'){ const a=grp(), b=grp();
            out+='<span class="mfrac"><span>'+a+'</span><span>'+b+'</span></span>'; continue; }
          if(cmd==='sqrt'){ const a=grp();
            out+='<span class="msqrt">'+RADSVG+'<span class="mund">'+a+'</span></span>'; continue; }
          if(cmd==='vec'){ const a=grp(); out+='<span class="mvec">'+a+'</span>'; continue; }
          if(cmd==='abs'){ const a=grp();
            out+='<span class="mo fence">|</span>'+a+'<span class="mo fence">|</span>'; continue; }
          if(cmd==='text'){ out+='<span class="mtext">'+e(grpRaw())+'</span>'; continue; }
          if(cmd===','){ out+='<span class="msp"></span>'; continue; }
          if(cmd===';'){ out+='<span class="msp2"></span>'; continue; }
          continue;
        }
        if(ch==='_'||ch==='^'){
          i++; const a=grp();
          out+=(ch==='_'?'<sub>':'<sup>')+a+(ch==='_'?'</sub>':'</sup>'); continue;
        }
        if(/[0-9]/.test(ch)){
          let n=''; while(i<s.length && /[0-9.,]/.test(s[i])){
            if(s[i]===',' && !/[0-9]/.test(s[i+1]||'')) break;
            n+=s[i++];
          }
          out+='<span class="mn">'+n+'</span>'; continue;
        }
        if(/[A-Za-z]/.test(ch)){
          let w=''; let j=i;
          while(j<s.length && /[A-Za-z]/.test(s[j])) w+=s[j++];
          let hit=null;
          for(let f=0;f<FN.length;f++){ if(w.toLowerCase().indexOf(FN[f])===0 && (!hit || FN[f].length>hit.length)) hit=FN[f]; }
          if(hit){ i+=hit.length; out+='<span class="mfn">'+hit+'</span>'; continue; }
          i++; out+='<span class="mv">'+e(ch)+'</span>'; continue;
        }
        if(LO_GREEK.indexOf(ch)>=0){ i++; out+='<span class="mv">'+ch+'</span>'; continue; }
        if(UP_GREEK.indexOf(ch)>=0){ i++; out+='<span class="mn">'+ch+'</span>'; continue; }
        if(OPS.indexOf(ch)>=0){ i++; out+='<span class="mo">'+e(ch)+'</span>'; continue; }
        if(TIGHT.indexOf(ch)>=0){ i++; out+='<span class="mo tight">·</span>'; continue; }
        if(ch==='/'){ i++; out+='<span class="mo tight">/</span>'; continue; }
        if('()[]|'.indexOf(ch)>=0){ i++; out+='<span class="mo fence">'+e(ch)+'</span>'; continue; }
        if(ch===' '){ i++; out+='<span class="msp"></span>'; continue; }
        i++; out+='<span class="mn">'+e(ch)+'</span>';
      }
      return out;
    }
    return '<span class="m">'+parse(null)+'</span>';
  };
})();
</script>

const SECTIONS = [
  {id:'elektr', name:'Elektr', c:'var(--volt)', mods:[1,2,3,4,5,6]},

let _tc = null;
function TC(){
  if(_tc) return _tc;
  const cs = getComputedStyle(document.documentElement);
  const g = function(n){ return cs.getPropertyValue(n).trim() || '#888'; };
  _tc = {bg:g('--bg'),panel:g('--panel'),panel2:g('--panel2'),panel3:g('--panel3'),
    line:g('--line'),line2:g('--line2'),fg:g('--fg'),fg2:g('--fg2'),fg3:g('--fg3'),
    volt:g('--volt'),amp:g('--amp'),mag:g('--mag'),ok:g('--ok'),warn:g('--warn'),bad:g('--bad')};
  return _tc;
}
function clearTC(){ _tc = null; }

function fitCanvas(cv){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if(cv._w !== w || cv._h !== h || cv._d !== dpr){
    cv.width = w*dpr; cv.height = h*dpr; cv._w = w; cv._h = h; cv._d = dpr;
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx:ctx, w:w, h:h};
}
function line(ctx,x1,y1,x2,y2,col,wd){
  ctx.strokeStyle=col; ctx.lineWidth=wd||2; ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function arrowHead(ctx,x,y,ang,size,col){
  ctx.fillStyle=col; ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-size,size*0.46); ctx.lineTo(-size,-size*0.46);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function arrow(ctx,x1,y1,x2,y2,col,wd,hs){
  line(ctx,x1,y1,x2,y2,col,wd||2);
  arrowHead(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),hs||7,col);
}
function txt(ctx,s,x,y,col,size,align,bold){
  ctx.fillStyle=col; ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.font=(bold?'700 ':'500 ')+(size||12)+'px "JetBrains Mono", monospace';
  ctx.fillText(s,x,y);
}
function dot(ctx,x,y,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }
function ringAt(ctx,x,y,r,col,wd){ ctx.strokeStyle=col; ctx.lineWidth=wd||2; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.stroke(); }
function roundRect(ctx,x,y,w,h,r,fill,stroke,lw){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
         ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.5; ctx.stroke(); }
}
function grid(ctx,w,h,step,col){
  ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath();
  for(let x=step;x<w;x+=step){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,h); }
  for(let y=step;y<h;y+=step){ ctx.moveTo(0,y+.5); ctx.lineTo(w,y+.5); }
  ctx.stroke();
}
/* zig-zag qarshilik */
function resistor(ctx,x,y,w,hh,col){
  ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(x,y);
  const n=6, dx=w/n;
  for(let i=0;i<n;i++) ctx.lineTo(x+dx*(i+0.5), y + (i%2? hh : -hh));
  ctx.lineTo(x+w,y); ctx.stroke();
}
/* g'altak */
function coil(ctx,x,y,w,r,n,col,lw){
  ctx.strokeStyle=col; ctx.lineWidth=lw||2.4; const dx=w/n;
  for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x+dx*(i+0.5), y, Math.min(r,dx*0.62), Math.PI, 0); ctx.stroke(); }
  line(ctx,x,y,x,y,col,lw||2.4);
}
/* batareya */
function battery(ctx,x,y,col){
  line(ctx,x-4,y-13,x-4,y+13,col,3);
  line(ctx,x+4,y-7,x+4,y+7,col,3);
}
/* harakatlanuvchi elektronlar */
function flowDots(ctx,pts,phase,col,n,r){
  if(pts.length<2) return;
  let total=0; const seg=[];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    seg.push(d); total+=d;
  }
  for(let k=0;k<n;k++){
    let s=((k/n)+phase)%1; let d=s*total; let i=0;
    while(i<seg.length && d>seg[i]){ d-=seg[i]; i++; }
    if(i>=seg.length) i=seg.length-1;
    const t=seg[i]?d/seg[i]:0;
    const x=pts[i][0]+(pts[i+1][0]-pts[i][0])*t, y=pts[i][1]+(pts[i+1][1]-pts[i][1])*t;
    dot(ctx,x,y,r||3,col);
  }
}

const SIMS = {};

/* --- 1. Elektroskob --- */
SIMS.electroscope = {
  ctl:[{k:'q',lb:'Berilgan zaryad',u:'birlik',min:0,max:8,step:1,val:3}],
  sw:[{k:'mat',lb:'Ishqalangan tayoqcha',opts:['Ebonit (−)','Shisha (+)'],val:0},
      {k:'probe',lb:'Yaqinlashtirilgan zaryad',opts:['Yo‘q','Musbat','Manfiy'],val:0}],
  out:function(s){
    const k=0.12281, x=k*s.q*s.q;
    let ang = 80*x/(1+x);
    const neg = s.mat===0;
    let d=0;
    if(s.probe===1) d = neg? -6 : 6;
    if(s.probe===2) d = neg? 6 : -6;
    if(s.q>0) ang = Math.max(0, Math.min(80, ang + d));
    return {ang:ang, sign:neg?'−':'+'};
  },
  ro:function(s,o){ return [
    {l:'Burchak',v:o.ang.toFixed(0)+'°',c:'volt'},
    {l:'Zaryad belgisi',v:s.q>0?o.sign:'—',c:''},
    {l:'Zaryad moduli',v:s.q+' b.',c:'amp'}]; },
  cols:['q, birlik','Burchak, °','Belgi'],
  meas:function(s,o){ return [String(s.q), o.ang.toFixed(0), s.q>0?o.sign:'—']; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC(); const cx=w*0.5, top=h*0.16;
    grid(ctx,w,h,28,c.line+'44');
    // korpus
    roundRect(ctx,cx-62,top+58,124,h-top-92,10,c.panel2,c.line,1.5);
    txt(ctx,'ELEKTROSKOB',cx,h-20,c.fg3,10,'center');
    // sharcha va o'q
    line(ctx,cx,top+22,cx,top+78,c.fg2,3);
    dot(ctx,cx,top+14,13,s.q>0? c.volt : c.fg3);
    // yaproqchalar
    const a=o.ang*Math.PI/180, L=Math.min(78,h-top-130);
    const ox=cx, oy=top+80;
    [-1,1].forEach(function(sg){
      ctx.strokeStyle=s.q>0? c.amp : c.fg2; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(ox,oy);
      ctx.lineTo(ox+sg*Math.sin(a)*L, oy+Math.cos(a)*L); ctx.stroke();
    });
    ctx.lineCap='butt';
    // zaryad belgilari
    if(s.q>0){
      const n=Math.min(8,s.q);
      for(let i=0;i<n;i++){
        const ph=(t*0.5+i/n)%1, yy=oy+Math.cos(a)*L*(0.25+0.6*((i%3)/3));
        const sg=(i%2)?1:-1;
        txt(ctx,o.sign, ox+sg*Math.sin(a)*L*(0.3+0.6*((i%3)/3))+sg*7, yy, c.amp, 11,'center',true);
      }

    // tayoqcha
    const px=w*0.16;
    roundRect(ctx,px-11,top+6,22,74,7,s.mat===0? '#2a2f3a' : 'rgba(150,200,220,.35)',c.line2,1.5);
    txt(ctx, s.mat===0?'EBONIT':'SHISHA', px, top+92, c.fg3, 9,'center');
    txt(ctx, s.mat===0?'−−−':'+++', px, top+16, s.mat===0? c.volt : c.amp, 12,'center',true);
    // probe
    if(s.probe>0){
      const qx=w-w*0.16;
      dot(ctx,qx,top+40,15, s.probe===1? c.amp : c.volt);
      txt(ctx, s.probe===1?'+':'−', qx, top+40, c.bg, 15,'center',true);
      txt(ctx,'sinov zaryadi',qx,top+68,c.fg3,9,'center');
      arrow(ctx,qx-22,top+40,cx+74,top+30,c.fg3,1.6,6);
    }
    txt(ctx,'θ = '+o.ang.toFixed(0)+'°',cx+86,oy+20,c.fg2,12,'left',true);
  }
};

/* --- 2. Kondensatorlar batareyasi --- */
SIMS.capbank = {
  ctl:[{k:'C1',lb:'C₁',u:'μF',min:1,max:10,step:0.5,val:4},

  sw:[{k:'mode',lb:'Ulanish',opts:['Parallel','Ketma-ket'],val:0}],
  out:function(s){

    const q = C*1e-6*s.U;

        cap(-0,-8,16,a[2],a[3],a[1]); ctx.restore();
      });
      line(ctx,w-40,cy-58,w-40,cy+58,c.fg2,2);

      txt(ctx,'KETMA-KET:  1/C = 1/C₁ + 1/C₂',w*0.5,22,c.amp,12,'center',true);
    }

      const yy2=vy+30+((i*53)%(vh-56));
      dot(ctx,kx-8-(kx-ax-16)*ph2, yy2, 4, c.volt);
    }
    txt(ctx,'Cu²⁺ ionlari katodga →',vx+8,vy+vh-12,c.fg3,9,'left');
    // m(t) grafik
    roundRect(ctx,gx,gy,gw,gh,8,c.panel2,c.line,1);
    const px=gx+34, py=gy+gh-24, pw=gw-48, phh=gh-42;
    line(ctx,px,py,px+pw,py,c.fg3,1.4); line(ctx,px,py,px,py-phh,c.fg3,1.4);
    txt(ctx,'t, min',px+pw,py+13,c.fg3,9,'right'); txt(ctx,'m, g',px-4,py-phh-2,c.fg3,9,'right');
    const mT=20, mM=0.6;
    line(ctx,px,py,px+pw,py-phh*(3.3e-7*s.I*mT*60*1000/mM),c.amp,2);
    const X=px+pw*(s.tm/mT), Y=py-phh*Math.min(1,o.mg/mM);
    dot(ctx,X,Y,5,c.volt);
    txt(ctx,'m ~ t',px+pw*0.5,py-phh*0.86,c.amp,9,'center');
  }
};
</script>
<script>
/* ============ SIMULYATORLAR (2-qism) ============ */

/* --- 8. Diod VAX --- */
SIMS.diode = {
  types:[{n:'Kremniy (Si)',Is:2e-14,Vo:0.7},{n:'Germaniy (Ge)',Is:9.3e-8,Vo:0.3}],
  ctl:[{k:'U',lb:'Diodga berilgan kuchlanish U',u:'V',min:-5,max:1.2,step:0.05,val:0.5}],
  sw:[{k:'tp',lb:'Diod turi',opts:['Kremniy (Si)','Germaniy (Ge)'],val:0}],
  out:function(s){
    const d=SIMS.diode.types[s.tp];
    let I;
    if(s.U>=0){ I = d.Is*(Math.exp(s.U/0.026)-1); if(I>0.05) I=0.05+(I-0.05)*0.0002; }
    else { I = -d.Is*1e6; if(s.U<-4.5) I = -0.004*(-s.U-4.5)/0.5; }
    return {I:I, mA:I*1000, d:d, fwd:s.U>=0};
  },
  ro:function(s,o){ return [
    {l:'Kuchlanish U',v:s.U.toFixed(2)+' V',c:'volt'},
    {l:'Tok I',v:(Math.abs(o.mA)<1? (o.mA*1000).toFixed(2)+' μA' : o.mA.toFixed(2)+' mA'),c:'amp'},
    {l:'Ulanish',v:o.fwd?'to‘g‘ri':'teskari',c:''},
    {l:'Ochilish U',v:o.d.Vo.toFixed(1)+' V',c:''}]; },
  cols:['Turi','U, V','I, mA'],
  meas:function(s,o){ return [o.d.n, s.U.toFixed(2), Math.abs(o.mA)<1? o.mA.toFixed(4) : o.mA.toFixed(2)]; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC();
    const gw=Math.min(w*0.56,320), gx=w-gw-14, gy=18, gh=h-46;
    // zanjir
    const cx=38, cy=h*0.44;
    line(ctx,cx-16,cy,cx+16,cy,c.fg2,2);
    ctx.fillStyle = o.fwd? c.volt : c.fg3;
    ctx.beginPath();
    if(o.fwd){ ctx.moveTo(cx-9,cy-11); ctx.lineTo(cx-9,cy+11); ctx.lineTo(cx+8,cy); }
    else { ctx.moveTo(cx+9,cy-11); ctx.lineTo(cx+9,cy+11); ctx.lineTo(cx-8,cy); }
    ctx.closePath(); ctx.fill();
    line(ctx, o.fwd? cx+8:cx-8, cy-12, o.fwd? cx+8:cx-8, cy+12, c.amp, 3);
    txt(ctx,o.d.n,cx,cy-30,c.fg2,10,'center',true);
    txt(ctx,o.fwd?'to‘g‘ri ulash':'teskari ulash',cx,cy+32,o.fwd?c.volt:c.fg3,10,'center');
    if(o.fwd && o.mA>0.5) flowDots(ctx,[[cx-16,cy],[cx+16,cy]],(t*0.9)%1,c.volt,4,2.4);
    // VAX
    roundRect(ctx,gx,gy,gw,gh,8,c.panel2,c.line,1);
    const ox=gx+gw*0.68, oy=gy+gh*0.62, pw=gw*0.26, nw=gw*0.56, ph=gh*0.5, nh=gh*0.3;
    line(ctx,gx+10,oy,gx+gw-10,oy,c.fg3,1.3);
    line(ctx,ox,gy+8,ox,gy+gh-10,c.fg3,1.3);
    txt(ctx,'U, V',gx+gw-12,oy+12,c.fg3,9,'right');
    txt(ctx,'I, mA',ox+6,gy+16,c.fg3,9,'left');
    const mU=1.2, mI=50;
    const X=function(u){ return u>=0 ? ox+pw*(u/mU) : ox-nw*(-u/5); };
    const Y=function(i){ return i>=0 ? oy-ph*Math.min(1,i/mI) : oy+nh*Math.min(1,(-i)/4); };
    ctx.strokeStyle=c.amp; ctx.lineWidth=2.2; ctx.beginPath();
    let first=true;
    for(let u=-5;u<=mU+0.001;u+=0.02){
      const st={U:u,tp:s.tp}; const oo=SIMS.diode.out(st);
      const xx=X(u), yy=Y(oo.mA);
      if(first){ ctx.moveTo(xx,yy); first=false; } else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    // ish nuqtasi
    dot(ctx,X(s.U),Y(o.mA),5,c.volt);
    line(ctx,X(o.d.Vo),oy-ph,X(o.d.Vo),oy+6,c.volt+'77',1.4);
    txt(ctx,o.d.Vo.toFixed(1)+' V',X(o.d.Vo),oy-ph-10,c.volt,9,'center');
    txt(ctx,'to‘g‘ri soha',ox+pw*0.5,gy+gh-16,c.amp,9,'center');
    txt(ctx,'teskari soha',ox-nw*0.5,gy+22,c.fg3,9,'center');
  }
};

/* --- 9. Termistor --- */
SIMS.thermistor = {
  ctl:[{k:'T',lb:'Harorat t',u:'°C',min:0,max:100,step:1,val:20}],
  sw:[{k:'el',lb:'Element',opts:['Termistor','Metall sim'],val:0}],
  out:function(s){
    const Tk=s.T+273.15;
    const Rt = 2000*Math.exp(3500*(1/Tk - 1/298.15));
    const Rm = 100*(1+0.004*(s.T-20));
    return {R: s.el===0? Rt : Rm, Rt:Rt, Rm:Rm, therm:s.el===0};
  },
  ro:function(s,o){ return [
    {l:'Harorat',v:s.T+' °C',c:''},
    {l:'Qarshilik R',v:o.R>=1000? (o.R/1000).toFixed(2)+' kΩ' : o.R.toFixed(0)+' Ω',c:'volt'},
    {l:'Tur',v:o.therm?'yarimo‘tkazgich':'metall',c:''}]; },
  cols:['t, °C','R (termistor), Ω','R (metall), Ω'],
  meas:function(s,o){ return [String(s.T), o.Rt.toFixed(0), o.Rm.toFixed(1)]; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC();
    const gw=Math.min(w*0.56,330), gx=w-gw-14, gy=18, gh=h-46;
    // termometr + element
    const bx=46, by=h*0.18, bh=h*0.6;
    roundRect(ctx,bx-9,by,18,bh,9,c.panel2,c.line2,1.5);
    const fr=s.T/100;
    roundRect(ctx,bx-6,by+bh*(1-fr)+3,12,bh*fr-6,6,
      'rgb('+Math.round(60+fr*190)+','+Math.round(140-fr*90)+','+Math.round(200-fr*150)+')',null,0);
    dot(ctx,bx,by+bh+8,12,'rgb('+Math.round(60+fr*190)+','+Math.round(140-fr*90)+','+Math.round(200-fr*150)+')');
    txt(ctx,s.T+' °C',bx,by-14,c.fg,12,'center',true);
    // element
    const ex=bx+66;
    if(o.therm){
      roundRect(ctx,ex,h*0.4,46,22,5,c.panel3,c.amp,2);
      txt(ctx,'t°',ex+23,h*0.4+11,c.amp,11,'center',true);
    } else {
      resistor(ctx,ex,h*0.4+11,46,8,c.volt);
    }
    txt(ctx,o.therm?'TERMISTOR':'METALL',ex+23,h*0.4-14,c.fg2,10,'center',true);
    txt(ctx,(o.R>=1000?(o.R/1000).toFixed(2)+' kΩ':o.R.toFixed(0)+' Ω'),ex+23,h*0.4+40,c.fg,12,'center',true);
    // R(t) grafik
    roundRect(ctx,gx,gy,gw,gh,8,c.panel2,c.line,1);
    const px=gx+38, py=gy+gh-26, pw=gw-52, phh=gh-44;
    line(ctx,px,py,px+pw,py,c.fg3,1.3); line(ctx,px,py,px,py-phh,c.fg3,1.3);
    txt(ctx,'t, °C',px+pw,py+13,c.fg3,9,'right'); txt(ctx,'R',px-6,py-phh-2,c.fg3,9,'right');
    const maxR=5000;
    ctx.strokeStyle=c.amp; ctx.lineWidth=2.2; ctx.beginPath();
    for(let T=0;T<=100;T+=2){
      const R=2000*Math.exp(3500*(1/(T+273.15)-1/298.15));
      const xx=px+pw*T/100, yy=py-phh*Math.min(1,R/maxR);
      if(T===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    ctx.strokeStyle=c.volt; ctx.lineWidth=2; ctx.beginPath();
    for(let T=0;T<=100;T+=5){
      const R=100*(1+0.004*(T-20))*8;
      const xx=px+pw*T/100, yy=py-phh*Math.min(1,R/maxR);
      if(T===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    txt(ctx,'termistor',px+pw*0.42,py-phh*0.78,c.amp,9,'left');
    txt(ctx,'metall (×8)',px+pw*0.42,py-phh*0.13,c.volt,9,'left');
    const cur = o.therm? o.Rt : o.Rm*8;
    dot(ctx,px+pw*s.T/100, py-phh*Math.min(1,cur/maxR),5,c.fg);
  }
};

/* --- 10. Magnit maydon + kompas --- */
SIMS.magfield = {
  ctl:[{k:'I',lb:'Tok kuchi I',u:'A',min:-20,max:20,step:1,val:12}],
  sw:[{k:'src',lb:'Maydon manbai',opts:['Tokli o‘tkazgich (ustdan)','Doimiy magnit'],val:0}],
  drag:true,
  init:function(s){ s.cxp=0.62; s.cyp=0.32; },
  out:function(s){
    return {src:s.src};
  },
  geo:function(s){
    const w=s._rw||600, h=s._rh||300;
    const wx = s.src===0? w*0.36 : w*0.3;
    const rpx=Math.hypot(s.cxp*w-wx, s.cyp*h-h*0.5);
    const rcm=Math.max(0.5, rpx/10);
    const B = s.src===0? 2e-7*Math.abs(s.I)/(rcm/100)*1e6 : 0;
    return {rcm:rcm, B:B, a:SIMS.magfield.angle(s,w,h)*180/Math.PI};
  },
  ro:function(s,o){
    const g=SIMS.magfield.geo(s);
    return [
    {l:'Manba',v:s.src===0?'to‘g‘ri tok':'doimiy magnit',c:''},
    {l:'Tok I',v:s.I+' A',c:'amp'},
    {l:'Masofa r',v:g.rcm.toFixed(1)+' sm',c:''},
    {l:'B kompas o‘rnida',v:s.src===0? g.B.toFixed(1)+' μT' : '—',c:'mag'}]; },
  cols:['Manba','I, A','r, sm','B, μT','Burchak, °'],
  meas:function(s,o,w,h){
    const g=SIMS.magfield.geo(s);
    return [s.src===0?'tok':'magnit', String(s.I), g.rcm.toFixed(1), s.src===0? g.B.toFixed(1):'—', g.a.toFixed(0)];
  },
  angle:function(s,w,h){
    const cx=s.cxp*w, cy=s.cyp*h;
    if(s.src===0){
      const wx=w*0.36, dx=cx-wx, dy=cy-h*0.5;
      const r=Math.hypot(dx,dy)||1;
      const sg=s.I>=0?1:-1;
      return Math.atan2(-sg*dx/r, sg*dy/r);
    } else {
      const mx=w*0.3, my=h*0.5;
      const dx=cx-mx, dy=cy-my, r2=dx*dx+dy*dy||1;
      const ex=(2*dx*dx-dy*dy)/Math.pow(r2,2.5), ey=(3*dx*dy)/Math.pow(r2,2.5);
      return Math.atan2(ey,ex);
    }
  },
  draw:function(ctx,w,h,s,o,t){
    const c=TC(); grid(ctx,w,h,28,c.line+'33');
    if(s.cxp===undefined){ s.cxp=0.62; s.cyp=0.32; }
    s._rw=w; s._rh=h;
    if(s.src===0){
      const wx=w*0.36, wy=h*0.5;
      const sg = s.I>=0?1:-1;
      // maydon chiziqlari (ustdan ko'rinish)
      [32,58,88,122].forEach(function(r){
        if(r>Math.min(w,h)*0.9) return;
        ringAt(ctx,wx,wy,r,c.mag+'99',1.6);
        if(s.I!==0) [0.6,2.7,4.4].forEach(function(th){
          arrowHead(ctx, wx+r*Math.cos(th), wy+r*Math.sin(th), th - sg*Math.PI/2, 6, c.mag);
        });
      });
      // o'tkazgich kesimi
      dot(ctx,wx,wy,13,c.panel2); ringAt(ctx,wx,wy,13,c.amp,2.4);
      if(s.I>0){ dot(ctx,wx,wy,4,c.amp); }
      else if(s.I<0){ line(ctx,wx-7,wy-7,wx+7,wy+7,c.amp,2.4); line(ctx,wx-7,wy+7,wx+7,wy-7,c.amp,2.4); }
      txt(ctx,'B = μ₀I/(2πr)',8,18,c.mag,11,'left',true);
      txt(ctx,'o‘ng qo‘l qoidasi',8,36,c.fg3,10,'left');
      txt(ctx, s.I>0? 'I = '+s.I+' A — ekrandan chiqmoqda ⊙' : (s.I<0? 'I = '+(-s.I)+' A — ekranga kirmoqda ⊗' : 'I = 0'),
        8, h-10, c.amp, 10,'left',true);
    } else {
      const mx=w*0.3, my=h*0.5;
      roundRect(ctx,mx-66,my-17,66,34,4,c.volt,null,0);
      roundRect(ctx,mx,my-17,66,34,4,c.mag,null,0);
      txt(ctx,'S',mx-33,my,c.bg,15,'center',true);
      txt(ctx,'N',mx+33,my,c.bg,15,'center',true);
      // dipol chiziqlari
      ctx.strokeStyle=c.mag+'88'; ctx.lineWidth=1.5;
      [0.5,0.9,1.4,2.0].forEach(function(k){
        ctx.beginPath();
        for(let a=0.08;a<Math.PI-0.08;a+=0.05){
          const r=38*k*Math.sin(a)*Math.sin(a);
          const x=mx+r*Math.cos(a)*2.1, y=my-r*Math.sin(a);
          if(a<0.1) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
        ctx.beginPath();
        for(let a=0.08;a<Math.PI-0.08;a+=0.05){
          const r=38*k*Math.sin(a)*Math.sin(a);
          const x=mx+r*Math.cos(a)*2.1, y=my+r*Math.sin(a);
          if(a<0.1) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      });
      txt(ctx,'Chiziqlar N dan chiqib S ga kiradi',8,18,c.mag,10,'left',true);
    }
    // kompas
    const cx=s.cxp*w, cy=s.cyp*h, a=SIMS.magfield.angle(s,w,h);
    ringAt(ctx,cx,cy,22,c.line2,2);
    ctx.fillStyle=c.panel+'cc'; ctx.beginPath(); ctx.arc(cx,cy,21,0,6.2832); ctx.fill();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);
    ctx.fillStyle=c.mag; ctx.beginPath(); ctx.moveTo(17,0); ctx.lineTo(-4,5); ctx.lineTo(-4,-5); ctx.closePath(); ctx.fill();
    ctx.fillStyle=c.fg3; ctx.beginPath(); ctx.moveTo(-17,0); ctx.lineTo(4,5); ctx.lineTo(4,-5); ctx.closePath(); ctx.fill();
    ctx.restore();
    dot(ctx,cx,cy,3,c.fg);
    txt(ctx,'kompas',cx,cy+34,c.fg3,9,'center');
  }
};

/* --- 11. Amper kuchi --- */
SIMS.ampere = {
  l:0.3,
  ctl:[{k:'B',lb:'Induksiya B',u:'T',min:0,max:1,step:0.05,val:0.4},
       {k:'I',lb:'Tok kuchi I',u:'A',min:0,max:10,step:0.5,val:5},
       {k:'a',lb:'Burchak α',u:'°',min:0,max:90,step:5,val:90}],
  sw:[{k:'dir',lb:'Tok yo‘nalishi',opts:['O‘ngga','Chapga'],val:0}],
  out:function(s){
    const l=0.3, F=s.B*s.I*l*Math.sin(s.a*Math.PI/180);
    return {F:F,l:l,sg:s.dir===0?1:-1};
  },
  ro:function(s,o){ return [
    {l:'Uzunlik l',v:'0,30 m',c:''},
    {l:'sin α',v:Math.sin(s.a*Math.PI/180).toFixed(3),c:''},
    {l:'Amper kuchi F',v:o.F.toFixed(3)+' N',c:'amp'},
    {l:'Yo‘nalish',v:o.F>0?(o.sg>0?'yuqoriga':'pastga'):'—',c:''}]; },
  cols:['B, T','I, A','α, °','F, N'],
  meas:function(s,o){ return [s.B.toFixed(2), s.I.toFixed(1), String(s.a), o.F.toFixed(3)]; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC();
    // maydon (ekranga kirgan) belgilari
    const x0=w*0.14, x1=w*0.86, y0=h*0.14, y1=h*0.84;
    roundRect(ctx,x0,y0,x1-x0,y1-y0,8,'transparent',c.line,1.2);
    const n=Math.round(s.B*7)+1;
    for(let i=0;i<6;i++) for(let j=0;j<4;j++){
      const xx=x0+24+i*((x1-x0-48)/5), yy=y0+22+j*((y1-y0-44)/3);
      if(s.B>0.02){ ringAt(ctx,xx,yy,5,c.mag+'aa',1.3); dot(ctx,xx,yy,1.6,c.mag); }
    }
    txt(ctx,'B = '+s.B.toFixed(2)+' T  (ekranga kirgan)',x0+4,y0-10,c.mag,10,'left',true);
    // o'tkazgich (burchak bilan)
    const cx=(x0+x1)/2, cy=(y0+y1)/2;
    const ar=(90-s.a)*Math.PI/180;
    const L=Math.min(130,(x1-x0)*0.42);
    const dx=Math.cos(ar)*L*o.sg, dy=-Math.sin(ar)*L*o.sg;
    line(ctx,cx-dx,cy-dy,cx+dx,cy+dy,c.amp,5);
    if(s.I>0){
      const ph=(t*0.6*Math.min(1.4,s.I/4))%1;
      for(let k=0;k<4;k++){
        const u=((k/4)+ph)%1;
        dot(ctx,cx-dx+2*dx*u, cy-dy+2*dy*u, 3, c.bg);
      }
      arrowHead(ctx,cx+dx,cy+dy,Math.atan2(dy,dx),8,c.amp);
    }
    txt(ctx,'I = '+s.I.toFixed(1)+' A',cx+dx*0.55,cy+dy*0.55-16,c.amp,11,'center',true);
    // kuch vektori
    if(o.F>0.004){
      const fl=Math.min(86, o.F*170);
      arrow(ctx,cx,cy,cx,cy-fl*o.sg,c.volt,3.4,9);
      txt(ctx,'F = '+o.F.toFixed(3)+' N',cx+12,cy-fl*o.sg/2,c.volt,12,'left',true);
    } else {
      txt(ctx,'F ≈ 0',cx+14,cy-14,c.fg3,12,'left',true);
    }
    txt(ctx,'α = '+s.a+'°',cx-dx*0.6,cy-dy*0.6+18,c.fg2,10,'center');
    txt(ctx,'F = B·I·l·sinα — chap qo‘l qoidasi',w*0.5,h-8,c.fg3,10,'center');
  }
};

/* --- 12. Elektr dvigatel --- */
SIMS.motor = {
  ctl:[{k:'I',lb:'Tok kuchi I',u:'A',min:0,max:5,step:0.25,val:2.5},
       {k:'B',lb:'Induksiya B',u:'T',min:0,max:1,step:0.05,val:0.5}],
  sw:[{k:'col',lb:'Kollektor',opts:['Yoqilgan','O‘chirilgan'],val:0},
      {k:'pol',lb:'Qutblar',opts:['N — S','S — N'],val:0}],
  out:function(s){
    const S=0.02, N=20;
    const Mmax=s.B*s.I*S*N;
    return {Mmax:Mmax, S:S, N:N};
  },
  ro:function(s,o){ return [
    {l:'Maks. moment',v:(o.Mmax*1000).toFixed(1)+' mN·m',c:'amp'},
    {l:'Ramka',v:'S = 200 sm², N = 20',c:''},
    {l:'Kollektor',v:s.col===0?'ishlayapti':'o‘chirilgan',c:''}]; },
  cols:['I, A','B, T','Maks. moment, mN·m','Kollektor'],
  meas:function(s,o){ return [s.I.toFixed(2), s.B.toFixed(2), (o.Mmax*1000).toFixed(1), s.col===0?'yoq':'o‘ch']; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC();
    const cx=w*0.5, cy=h*0.48, Rr=Math.min(w*0.2,h*0.3);
    const pol = s.pol===0?1:-1;
    // qutblar
    const px=Math.min(w*0.3, Rr+72);
    roundRect(ctx,cx-px-40,cy-56,40,112,6, pol>0? c.mag : c.volt,null,0);
    roundRect(ctx,cx+px,cy-56,40,112,6, pol>0? c.volt : c.mag,null,0);
    txt(ctx,pol>0?'N':'S',cx-px-20,cy,c.bg,16,'center',true);
    txt(ctx,pol>0?'S':'N',cx+px+20,cy,c.bg,16,'center',true);
    // maydon chiziqlari
    for(let i=-2;i<=2;i++) line(ctx,cx-px,cy+i*24,cx+px,cy+i*24,c.mag+'55',1.3);
    // aylanish
    if(s._ang===undefined) s._ang=0.4;
    if(s._w===undefined) s._w=0;
    const ang=s._ang;
    let M = o.Mmax*Math.sin(ang);
    if(s.col===0) M = o.Mmax*Math.abs(Math.sin(ang));
    s._w = s._w*0.90 + M*1.15;
    s._ang = (s._ang + s._w*0.016)%(Math.PI*2);
    // ramka
    const a=ang;
    const ex=Math.cos(a)*Rr, ey=0;
    ctx.strokeStyle=c.amp; ctx.lineWidth=4; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(cx-ex,cy-Rr*0.62); ctx.lineTo(cx+ex,cy-Rr*0.62);
    ctx.lineTo(cx+ex,cy+Rr*0.62); ctx.lineTo(cx-ex,cy+Rr*0.62); ctx.closePath(); ctx.stroke();
    // kuchlar
    if(o.Mmax>0.0005){
      const fs=Math.min(34, o.Mmax*2600)*Math.abs(Math.cos(a));
      const sg=(s.col===0? 1 : (Math.sin(a)>=0?1:1))*(Math.cos(a)>=0?1:-1);
      arrow(ctx,cx+ex,cy-Rr*0.62,cx+ex,cy-Rr*0.62-fs*sg,c.volt,2.6,7);
      arrow(ctx,cx-ex,cy+Rr*0.62,cx-ex,cy+Rr*0.62+fs*sg,c.volt,2.6,7);
    }
    // o'q va kollektor
    line(ctx,cx,cy-Rr*0.62,cx,cy+Rr*0.62,c.fg3,2);
    dot(ctx,cx,cy+Rr*0.62+16,9,c.panel3); ringAt(ctx,cx,cy+Rr*0.62+16,9,c.line2,1.5);
    txt(ctx, s.col===0?'kollektor':'uzluksiz halqa', cx, cy+Rr*0.62+34, s.col===0? c.ok : c.bad, 10,'center',true);
    txt(ctx,'ω ≈ '+Math.abs(s._w).toFixed(1)+' rad/s',w*0.5,18,c.fg2,11,'center',true);
    txt(ctx, s.col===0? 'Kollektor har yarim aylanada tokni teskari qiladi'
                      : 'Kollektorsiz ramka tebranib to‘xtaydi', w*0.5, h-8, c.fg3, 10,'center');
  }
};

/* --- 13. Elektromagnit induksiya --- */
SIMS.induction = {
  ctl:[{k:'v',lb:'Magnit tezligi',u:'·',min:0,max:5,step:0.5,val:2.5},
       {k:'N',lb:'O‘ramlar soni N',u:'',min:10,max:200,step:10,val:60}],
  sw:[{k:'mv',lb:'Magnit holati',opts:['Tebranmoqda','Tinch (g‘altak ichida)'],val:0}],
  out:function(s){ return {eps: s._eps||0, x: s._x||0}; },
  ro:function(s,o){ return [
    {l:'Magnit holati',v:s.mv===0?'harakatda':'tinch',c:''},
    {l:'Oqim Φ',v:(s._phi||0).toFixed(3)+' mWb',c:''},
    {l:'EYuK ε',v:(s._eps||0).toFixed(2)+' V',c:'volt'},
    {l:'Tok yo‘nalishi',v:Math.abs(s._eps||0)<0.02?'yo‘q':((s._eps>0)?'→':'←'),c:'amp'}]; },
  cols:['N','Tezlik','Maks. ε, V'],
  meas:function(s,o){ return [String(s.N), s.mv===0? s.v.toFixed(1):'0', (s._peak||0).toFixed(2)]; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC();
    const cx=w*0.46, cy=h*0.42;
    // g'altak
    const cw=118, cr=26;
    coil(ctx,cx-cw/2,cy,cw,cr,7,c.amp,3);
    txt(ctx,'N = '+s.N,cx,cy-46,c.amp,11,'center',true);
    // magnit holati
    if(s.mv===1){ s._x=0; }
    else { s._x = Math.sin(t*s.v*0.55)*120; }
    const phi = 1/(1+Math.pow(s._x/46,2));
    if(s._lp===undefined) s._lp=phi;
    const dt = 0.016;
    const eps = s.mv===1? 0 : -s.N*(phi-s._lp)/dt*0.0016;
    s._lp = phi; s._phi = phi*0.6; s._eps = eps;
    s._peak = Math.max(s._peak||0, Math.abs(eps));
    // magnit
    const mx=cx+s._x;
    roundRect(ctx,mx-34,cy-13,34,26,3,c.mag,null,0);
    roundRect(ctx,mx,cy-13,34,26,3,c.volt,null,0);
    txt(ctx,'N',mx-17,cy,c.bg,12,'center',true);
    txt(ctx,'S',mx+17,cy,c.bg,12,'center',true);
    if(s.mv===0){
      const dir = Math.cos(t*s.v*0.55)>0?1:-1;
      arrow(ctx,mx+dir*42,cy-30,mx+dir*66,cy-30,c.fg3,2,6);
    }
    // galvanometr
    const gx=w*0.84, gy=h*0.42, gr=Math.min(34,w*0.1);
    line(ctx,cx-cw/2,cy+cr+4,cx-cw/2-20,cy+cr+4,c.fg2,2);
    line(ctx,cx-cw/2-20,cy+cr+4,cx-cw/2-20,gy+gr+22,c.fg2,2);
    line(ctx,cx-cw/2-20,gy+gr+22,gx,gy+gr+22,c.fg2,2);
    line(ctx,gx,gy+gr+22,gx,gy+gr,c.fg2,2);
    line(ctx,cx+cw/2,cy+cr+4,gx+gr+16,cy+cr+4,c.fg2,2);
    line(ctx,gx+gr+16,cy+cr+4,gx+gr+16,gy,c.fg2,2);
    line(ctx,gx+gr+16,gy,gx+gr,gy,c.fg2,2);
    ringAt(ctx,gx,gy,gr,c.line2,2);
    ctx.fillStyle=c.panel; ctx.beginPath(); ctx.arc(gx,gy,gr-1,0,6.2832); ctx.fill();
    const na=Math.max(-1.1,Math.min(1.1, eps*0.9));
    ctx.save(); ctx.translate(gx,gy); ctx.rotate(na);
    line(ctx,0,0,0,-(gr-7),c.volt,2.4); ctx.restore();
    dot(ctx,gx,gy,3,c.fg);
    txt(ctx,'0',gx,gy+gr-9,c.fg3,9,'center');
    txt(ctx,'G',gx,gy-gr+10,c.fg3,10,'center',true);
    txt(ctx,'ε = −N·ΔΦ/Δt  ⇒  ε = '+eps.toFixed(2)+' V',w*0.5,h-10,
      Math.abs(eps)>0.02? c.volt : c.fg3,11,'center',true);
  }
};

/* --- 14. Transformator --- */
SIMS.transformer = {
  ctl:[{k:'N1',lb:'Birlamchi N₁',u:'o‘ram',min:100,max:1000,step:50,val:600},
       {k:'N2',lb:'Ikkilamchi N₂',u:'o‘ram',min:50,max:1000,step:50,val:150},
       {k:'U1',lb:'Kirish kuchlanishi U₁',u:'V',min:0,max:240,step:10,val:220}],
  sw:[{k:'src',lb:'Manba',opts:['O‘zgaruvchan (50 Hz)','O‘zgarmas'],val:0}],
  out:function(s){
    const k=s.N1/s.N2;
    const ac=s.src===0;
    const U2 = ac ? s.U1/k : 0;
    const I2 = U2/50, I1 = ac? I2/k : 0;
    return {k:k,U2:U2,I1:I1,I2:I2,ac:ac};
  },
  ro:function(s,o){ return [
    {l:'Koeffitsiyent k',v:o.k.toFixed(2),c:'volt'},
    {l:'Chiqish U₂',v:o.U2.toFixed(1)+' V',c:'amp'},
    {l:'Rejim',v:o.k>1?'pasaytiruvchi':(o.k<1?'kuchaytiruvchi':'1:1'),c:''},
    {l:'I₁ / I₂',v:o.I1.toFixed(2)+' / '+o.I2.toFixed(2)+' A',c:''}]; },
  cols:['N₁','N₂','U₁, V','U₂, V','k = U₁/U₂'],
  meas:function(s,o){ return [String(s.N1), String(s.N2), s.U1.toFixed(0), o.U2.toFixed(1), o.U2>0?(s.U1/o.U2).toFixed(2):'—']; },
  draw:function(ctx,w,h,s,o,t){
    const c=TC();
    const cx=w*0.5, cy=h*0.46;
    // o'zak
    roundRect(ctx,cx-30,cy-72,60,144,5,c.panel3,c.line2,2);
    roundRect(ctx,cx-16,cy-56,32,112,3,c.panel,c.line,1.5);
    txt(ctx,'O‘ZAK',cx,cy+88,c.fg3,9,'center');
    // o'ramlar
    const n1=Math.round(3+s.N1/160), n2=Math.round(3+s.N2/160);
    ctx.lineWidth=3.4; ctx.strokeStyle=c.amp;
    for(let i=0;i<n1;i++){ ctx.beginPath(); ctx.arc(cx-30, cy-60+i*(120/n1)+6, 13, -Math.PI/2, Math.PI/2, true); ctx.stroke(); }
    ctx.strokeStyle=c.volt;
    for(let i=0;i<n2;i++){ ctx.beginPath(); ctx.arc(cx+30, cy-60+i*(120/n2)+6, 13, -Math.PI/2, Math.PI/2, false); ctx.stroke(); }
    txt(ctx,'N₁ = '+s.N1,cx-56,cy-84,c.amp,11,'center',true);
    txt(ctx,'N₂ = '+s.N2,cx+56,cy-84,c.volt,11,'center',true);
    // oqim animatsiyasi
    if(o.ac && s.U1>0){
      const ph=Math.sin(t*3.2);
      ctx.strokeStyle=c.mag+'99'; ctx.lineWidth=2;
      for(let i=0;i<3;i++){
        const yy=cy-40+i*40;
        ctx.beginPath(); ctx.moveTo(cx-10,yy); ctx.lineTo(cx+10,yy); ctx.stroke();
        arrowHead(ctx,cx+(ph>0?10:-10),yy, ph>0?0:Math.PI, 5, c.mag);
      }
      txt(ctx,'Φ(t)',cx,cy-100,c.mag,10,'center',true);
    }
    // sinus grafiklar
    function wave(x0,x1,yc,amp,col,lbl){
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
      for(let x=x0;x<=x1;x+=2){
        const u=(x-x0)/(x1-x0);
        const y=yc - Math.sin(u*Math.PI*3.4 - t*3.2)*amp;
        if(x===x0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      txt(ctx,lbl,x0,yc-amp-13,col,10,'left',true);
    }
    const lw=Math.max(40,cx-120);
    if(o.ac){
      wave(10,10+lw,cy-30,Math.min(26,s.U1/9),c.amp,s.U1.toFixed(0)+' V');
      wave(w-10-lw,w-10,cy+34,Math.min(26,o.U2/9),c.volt,o.U2.toFixed(0)+' V');
    } else {
      line(ctx,10,cy-30,10+lw,cy-30,c.amp,2);
      txt(ctx,s.U1.toFixed(0)+' V (=)',10,cy-48,c.amp,10,'left',true);
      line(ctx,w-10-lw,cy+34,w-10,cy+34,c.fg3,2);
      txt(ctx,'U₂ = 0 — o‘zgarmas tokda ishlamaydi',w-10,cy+54,c.bad,10,'right',true);
    }
    txt(ctx,'k = N₁/N₂ = '+o.k.toFixed(2),w*0.5,h-10,c.fg,12,'center',true);
  }
};

<script>
/* ============ DARS ANIMATSIYALARI ============ */
const VIZ = {};

VIZ.coulomb = function(ctx,w,h,t){
  const c=TC(); const cy=h*0.5, x1=w*0.3, x2=w*0.7, R=15;
  ctx.strokeStyle=c.volt+'77'; ctx.lineWidth=1.5;
  for(let k=-4;k<=4;k++){
    if(k===0) continue;
    ctx.beginPath();
    for(let u=0;u<=1.001;u+=0.02){
      const x=x1+(x2-x1)*u;
      const bend=Math.sin(u*Math.PI)*k*16;
      ctx.lineTo(x, cy+bend);
    }
    ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(x1,cy); ctx.lineTo(x2,cy); ctx.stroke();
  for(let k=0;k<6;k++){
    const u=((t*0.22)+k/6)%1;
    const x=x1+(x2-x1)*u;
    arrowHead(ctx,x,cy,0,6,c.volt);
    [-2,2].forEach(function(j){ arrowHead(ctx,x,cy+Math.sin(u*Math.PI)*j*16,0,5,c.volt+'aa'); });
  }
  dot(ctx,x1,cy,R,c.amp); txt(ctx,'+',x1,cy,c.bg,19,'center',true);
  dot(ctx,x2,cy,R,c.volt); txt(ctx,'−',x2,cy,c.bg,19,'center',true);
  const u=(t*0.3)%1, tx=x1+(x2-x1)*u;
  dot(ctx,tx,cy-54,7,c.mag);
  arrow(ctx,tx,cy-54,tx+16,cy-44,c.mag,2,6);
  txt(ctx,'sinov zaryadi q₀',tx,cy-70,c.mag,10,'center');
  txt(ctx,'F = k·q₁q₂/r²',12,18,c.fg3,11,'left',true);
};

VIZ.potential = function(ctx,w,h,t){
  const c=TC(); const cx=w*0.38, cy=h*0.5;
  [28,52,78,106].forEach(function(r,i){
    ringAt(ctx,cx,cy,r,c.volt+'66',1.4);
    txt(ctx,'φ'+(i+1),cx+r-4,cy-8,c.volt+'cc',9,'left');

  for(let k=0;k<10;k++){

    line(ctx,cx+Math.cos(a)*18,cy+Math.sin(a)*18,cx+Math.cos(a)*118,cy+Math.sin(a)*118,c.amp+'77',1.3);
    const u=((t*0.3)+k/10)%1;
    arrowHead(ctx,cx+Math.cos(a)*(18+100*u),cy+Math.sin(a)*(18+100*u),a,5,c.amp);
  }
  dot(ctx,cx,cy,15,c.amp); txt(ctx,'+',cx,cy,c.bg,18,'center',true);

};

VIZ.capacitor = function(ctx,w,h,t){
  const c=TC(); const cy=h*0.5, x1=w*0.3, x2=w*0.68, ph=h*0.3;
  const slide=(Math.sin(t*0.5)*0.5+0.5);
  const eps=1+slide*2;
  roundRect(ctx,x1+6,cy-ph,(x2-x1-12)*slide,ph*2,2,c.mag+'33',c.mag+'77',1.2);
  if(slide>0.1) txt(ctx,'dielektrik ε = '+eps.toFixed(1),x1+8,cy+ph+16,c.mag,10,'left',true);
  line(ctx,x1,cy-ph,x1,cy+ph,c.amp,4);
  line(ctx,x2,cy-ph,x2,cy+ph,c.volt,4);
  const n=7;
  for(let i=0;i<n;i++){
    const yy=cy-ph+ph*2*(i+0.5)/n;
    const alpha=Math.round(255*(1/eps)).toString(16).padStart(2,'0');
    line(ctx,x1+5,yy,x2-5,yy,c.fg2+alpha,1.5);
    const u=((t*0.4)+i/n)%1;
    arrowHead(ctx,x1+5+(x2-x1-10)*u,yy,0,5,c.fg2);
  }
  for(let i=0;i<5;i++){
    txt(ctx,'+',x1-11,cy-ph+ph*2*(i+0.5)/5,c.amp,13,'center',true);
    txt(ctx,'−',x2+11,cy-ph+ph*2*(i+0.5)/5,c.volt,13,'center',true);
  }
  txt(ctx,'C = ε·ε₀·S/d',12,18,c.fg3,11,'left',true);
  txt(ctx,'C = '+(eps*2).toFixed(1)+' nF',w-12,18,c.volt,12,'right',true);
};

VIZ.current = function(ctx,w,h,t){
  const c=TC(); const cy=h*0.5;
  const x0=w*0.1, x1=w*0.9, th=34;
  roundRect(ctx,x0,cy-th/2,x1-x0,th,6,c.panel2,c.line2,1.5);

  for(let i=0;i<14;i++) for(let j=0;j<2;j++){
    dot(ctx,x0+18+i*((x1-x0-36)/13), cy-7+j*14, 3.4, c.fg3+'88');
  }
  // dreyf
  const U=1.4+Math.sin(t*0.6)*0.9;
  const nEl=16;
  for(let k=0;k<nEl;k++){
    const u=((t*0.1*U)+k/nEl)%1;
    const yy=cy-9+((k*37)%19);
    dot(ctx,x0+6+(x1-x0-12)*u, yy, 3.6, c.volt);

  txt(ctx,'I = q/t = n·e·S·v',12,18,c.fg3,11,'left',true);
};

VIZ.emf = function(ctx,w,h,t){
  const c=TC(); const cy=h*0.5, L=w*0.12, R=w*0.78;
  const pts=[[L,cy-44],[R,cy-44],[R,cy+44],[L,cy+44],[L,cy-44]];
  ctx.strokeStyle=c.fg2; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(L,cy-44);
  pts.slice(1).forEach(function(p){ctx.lineTo(p[0],p[1]);}); ctx.stroke();
  const Rv=2+Math.sin(t*0.45)*1.6;
  const E=4.5,r=0.6, I=E/(Rv+r), U=E-I*r;
  roundRect(ctx,(L+R)/2-44,cy+30,88,28,6,c.panel2,c.line2,1.4);
  battery(ctx,(L+R)/2-20,cy+44,c.fg);
  resistor(ctx,(L+R)/2+2,cy+44,34,6,c.bad);
  txt(ctx,'ε = 4,5 V · r = 0,6 Ω',(L+R)/2,cy+72,c.fg3,10,'center');
  resistor(ctx,(L+R)/2-32,cy-44,64,9,c.amp);
  txt(ctx,'R = '+Rv.toFixed(1)+' Ω',(L+R)/2,cy-66,c.amp,11,'center',true);
  flowDots(ctx,pts,(t*0.18*I)%1,c.volt,12,2.8);
  // energiya ustunlari
  const bx=w-56, by=h*0.2, bh=h*0.56;
  const pTot=E*I, pOut=I*I*Rv;
  roundRect(ctx,bx,by,18,bh,4,c.panel2,c.line,1);
  roundRect(ctx,bx,by+bh*(1-pOut/pTot),18,bh*(pOut/pTot),4,c.ok,null,0);
  txt(ctx,'FIK',bx+9,by-12,c.fg3,9,'center');
  txt(ctx,(pOut/pTot*100).toFixed(0)+'%',bx+9,by+bh+14,c.ok,11,'center',true);
  txt(ctx,'I = ε/(R+r) = '+I.toFixed(2)+' A',12,18,c.fg2,11,'left',true);
  txt(ctx,'U = '+U.toFixed(2)+' V',12,36,c.fg3,10,'left');
};

VIZ.semicon = function(ctx,w,h,t){
  const c=TC(); const cy=h*0.5, x0=w*0.14, x1=w*0.86, th=h*0.44;
  const fwd=Math.sin(t*0.4)>0;

  roundRect(ctx,(x0+x1)/2-bw/2,cy-th/2,bw,th,2,c.panel3,c.line2,1.2);

  txt(ctx, fwd? 'TO‘G‘RI ULASH — tok o‘tadi' : 'TESKARI ULASH — tok o‘tmaydi',

};

VIZ.bfield = function(ctx,w,h,t){
  const c=TC(); const cx=w*0.42, cy=h*0.5;
  line(ctx,cx,10,cx,h-10,c.amp,5);

  const fx=w*0.82;

  for(let i=0;i<n;i++) for(let j=0;j<3;j++){

  }
  line(ctx,fx-40,cy,fx+40,cy,c.volt,4);

VIZ.lorentz = function(ctx,w,h,t){

VIZ.induction = function(ctx,w,h,t){
  const c=TC(); const cx=w*0.46, cy=h*0.46;

VIZ.selfind = function(ctx,w,h,t){

  line(ctx,w*0.14,cy,w*0.3,cy,c.fg2,2);

  ctx.strokeStyle=c.mag+Math.round(I*200+30).toString(16).padStart(2,'0');

};

VIZ.lc = function(ctx,w,h,t){
  const c=TC(); const cy=h*0.46;
  const q=Math.cos(t*1.6), i=-Math.sin(t*1.6);
  const L=w*0.26, R=w*0.74;
  ctx.strokeStyle=c.fg2; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(L,cy-46); ctx.lineTo(R,cy-46);
  ctx.lineTo(R,cy+46); ctx.lineTo(L,cy+46); ctx.closePath(); ctx.stroke();
  // kondensator chapda
  line(ctx,L-0,cy-14,L-0,cy+14,c.fg2,0);
  ctx.clearRect(L-3,cy-18,6,36);
  line(ctx,L-5,cy-16,L-5,cy+16, q>0? c.amp : c.volt, 3.4);
  line(ctx,L+5,cy-16,L+5,cy+16, q>0? c.volt : c.amp, 3.4);
  txt(ctx,'C',L-22,cy,c.fg2,12,'center',true);

  ctx.clearRect(R-3,cy-30,6,60);

  roundRect(ctx,32+bw,h-26,bw-8,10,5,c.panel3,null,0);

  txt(ctx,'W magnit',32+bw,h-36,c.mag,9,'left',true);
  txt(ctx,'T = 2π√(LC)',12,18,c.fg3,11,'left',true);
};

VIZ.actrans = function(ctx,w,h,t){

  txt(ctx,'U₁·I₁ = U₂·I₂ — quvvat saqlanadi',14,h-10,c.fg3,10,'left');
};

VIZ.emwave = function(ctx,w,h,t){
  const c=TC(); const cy=h*0.5;
  line(ctx,14,cy,w-14,cy,c.fg3,1.3);
  arrowHead(ctx,w-14,cy,0,7,c.fg3);

  ctx.strokeStyle=c.volt; ctx.lineWidth=2.4; ctx.beginPath();
  for(let x=14;x<=w-14;x+=2){
    const u=(x-14)/(w-28);

    if(x===14) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }

  ctx.strokeStyle=c.mag; ctx.lineWidth=1.8; ctx.beginPath();
  for(let x=14;x<=w-14;x+=2){

    const x=20+k*((w-40)/8), u=(x-14)/(w-28);

  txt(ctx,'E',18,cy-A-4,c.volt,12,'left',true);
  txt(ctx,'B',18,cy+A*0.3,c.mag,12,'left',true);
  txt(ctx,'E ⊥ B ⊥ v · λ = c/ν',w-16,18,c.fg3,11,'right',true);
};

VIZ.radio = function(ctx,w,h,t){
  const c=TC();
  const y1=h*0.26, y2=h*0.72;
  line(ctx,14,y1,w-14,y1,c.line,1);
  line(ctx,14,y2,w-14,y2,c.line,1);
  ctx.strokeStyle=c.volt; ctx.lineWidth=2; ctx.beginPath();
  for(let x=14;x<=w-14;x+=2){
    const u=(x-14)/(w-28);
    ctx.lineTo(x, y1-Math.sin(u*Math.PI*2.2-t*1.6)*h*0.13);
  }
  ctx.stroke();
  txt(ctx,'tovush signali (past chastota)',16,y1-h*0.16,c.volt,10,'left',true);
  ctx.strokeStyle=c.amp; ctx.lineWidth=1.6; ctx.beginPath();
  for(let x=14;x<=w-14;x+=1.5){
    const u=(x-14)/(w-28);
    const env=0.45+0.5*(0.5+0.5*Math.sin(u*Math.PI*2.2-t*1.6));
    ctx.lineTo(x, y2-Math.sin(u*Math.PI*34-t*8)*h*0.19*env);
  }
  ctx.stroke();
  ctx.strokeStyle=c.mag+'99'; ctx.lineWidth=1.3;
  [1,-1].forEach(function(sg){
    ctx.beginPath();
    for(let x=14;x<=w-14;x+=2){
      const u=(x-14)/(w-28);
      const env=0.45+0.5*(0.5+0.5*Math.sin(u*Math.PI*2.2-t*1.6));
      ctx.lineTo(x, y2-sg*h*0.19*env);
    }
    ctx.stroke();
  });
  txt(ctx,'modulyatsiyalangan to‘lqin (AM)',16,y2+h*0.24,c.amp,10,'left',true);
  txt(ctx,'o‘rama = tovush',w-16,y2+h*0.24,c.mag,10,'right',true);
};

<script>
/* ============ HOLAT VA SAQLASH ============ */
const KEY='fizika.em.v1';
let P = {name:'',mods:{},tests:{},ex:{},labs:{},hist:[]};
function loadP(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const o=JSON.parse(raw); if(o && typeof o==='object') P=Object.assign(P,o); }
  }catch(e){}
  P.mods=P.mods||{}; P.tests=P.tests||{}; P.ex=P.ex||{}; P.labs=P.labs||{}; P.hist=P.hist||[];
}
function saveP(){ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
loadP();

/* ============ YORDAMCHILAR ============ */
const $=function(s,r){ return (r||document).querySelector(s); };
const $$=function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"]/g,function(ch){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[ch]; }); }
function pct(x){ return Math.round(x*100); }
function lvlDots(l){ let s='<span class="lvl" title="'+LVL_NAME[l]+'">'; for(let i=1;i<=3;i++) s+='<i class="'+(i<=l?'f':'')+'"></i>'; return s+'</span>'; }
function toast(msg){
  const host=$('#toastHost'); host.innerHTML='';
  const d=document.createElement('div'); d.className='toast pop'; d.textContent=msg;
  host.appendChild(d); setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },2600);
}
function parseNum(s){
  if(s===null||s===undefined) return NaN;
  let x=String(s).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/·10\^?/g,'e').replace(/×10\^?/g,'e').replace(/\*10\^?/g,'e');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(x)) return NaN;
  return parseFloat(x);
}
function near(a,ans,tol){
  if(isNaN(a)) return false;
  const t=Math.max(Math.abs(ans)*(tol||0.02),Math.abs(ans)*1e-9+1e-12);
  return Math.abs(a-ans)<=t;
}
function fmt(x){
  if(x===0) return '0';
  const a=Math.abs(x);
  if(a>=1e5||a<1e-3) return x.toExponential(2).replace('e','·10^');
  return (Math.round(x*1000)/1000).toString().replace('.',',');
}

/* ============ O'ZLASHTIRISH HISOBI ============ */
const LW=[1,1.15,1.3];
function modMastery(m){
  let tw=0,ts=0;
  for(let l=1;l<=3;l++){
    const r=P.tests[m+'-'+l];
    tw+=LW[l-1]; ts+=LW[l-1]*(r? r.best : 0);
  }
  const testPart = tw? ts/tw : 0;
  const exList=E_BY_M[m]||[];
  let solved=0; exList.forEach(function(e){ if(P.ex[e.id] && P.ex[e.id].solved) solved++; });
  const exPart = exList.length? solved/exList.length : 0;
  const labs=LAB_BY_M[m]||[];
  let ld=0; labs.forEach(function(l){ if(P.labs[l.id] && P.labs[l.id].done) ld++; });
  const hasLab=labs.length>0;
  const labPart = hasLab? ld/labs.length : 0;
  const read = P.mods[m]? 1:0;
  if(hasLab) return testPart*0.58 + exPart*0.2 + labPart*0.12 + read*0.10;
  return testPart*0.66 + exPart*0.24 + read*0.10;
}
function heatState(v){ if(v<=0.001) return 0; if(v<0.4) return 1; if(v<0.65) return 2; if(v<0.85) return 3; return 4; }
function overall(){
  let s=0; MODULES.forEach(function(m){ s+=modMastery(m.id); });
  return s/MODULES.length;
}
function setRing(){
  const v=overall(); const C=2*Math.PI*15.5;
  const arc=$('#ringArc'); if(arc) arc.setAttribute('stroke-dashoffset', String(C*(1-v)));
  const tx=$('#ringTxt'); if(tx) tx.textContent=pct(v)+'%';
}

/* ============ TAHLIL ============ */
function analyze(att){
  const tagS={}, subS={}, lvlS={};
  att.items.forEach(function(it){
    const q=it.q, ok=it.ok;
    (tagS[q.tag]=tagS[q.tag]||{c:0,t:0}); tagS[q.tag].t++; if(ok) tagS[q.tag].c++;
    const sk=q.m+'|'+q.sub;
    (subS[sk]=subS[sk]||{c:0,t:0,m:q.m,sub:q.sub}); subS[sk].t++; if(ok) subS[sk].c++;
    (lvlS[q.lvl]=lvlS[q.lvl]||{c:0,t:0}); lvlS[q.lvl].t++; if(ok) lvlS[q.lvl].c++;
  });
  const strong=[],weak=[],mid=[];
  Object.keys(subS).forEach(function(k){
    const s=subS[k], r=s.c/s.t;
    const o={name:s.sub, m:s.m, r:r, c:s.c, t:s.t};
    if(r>=0.8) strong.push(o); else if(r<0.5) weak.push(o); else mid.push(o);
  });
  strong.sort(function(a,b){return b.r-a.r;}); weak.sort(function(a,b){return a.r-b.r;});
  let worstTag=null, worstR=2;
  Object.keys(tagS).forEach(function(k){
    const r=tagS[k].c/tagS[k].t;
    if(tagS[k].t>=1 && r<worstR){ worstR=r; worstTag=k; }
  });
  return {tags:tagS, subs:subS, lvls:lvlS, strong:strong, weak:weak, mid:mid, worstTag:worstTag, worstR:worstR};
}
function localAdvice(att,an){
  const out=[];
  const r=att.score/att.total;
  if(r>=0.9) out.push('Natija juda yaxshi — bu darajani o‘zlashtirgansiz. Keyingi darajaga o‘tishga tayyormisiz.');
  else if(r>=0.7) out.push('Asosiy tushunchalarni egallagansiz, lekin ayrim joylarda aniqlik yetishmaydi.');
  else if(r>=0.4) out.push('Mavzuning yarmi o‘zlashtirilgan. Nazariyani qayta o‘qib, mashqlarni bosqichli yechish foydali.');
  else out.push('Hozircha asos mustahkam emas. Modulni boshidan o‘qib, oson darajadan boshlash kerak.');
  if(an.worstTag && an.worstR<0.6){
    const T=TAGS[an.worstTag];
    out.push('Eng ko‘p xato «'+T.n.toLowerCase()+'» turida: '+T.d.toLowerCase()+'.');
    if(an.worstTag==='birlik') out.push('Har bir masalada avval barcha kattalikni SI ga aylantirib, so‘ng formulaga qo‘ying (sm→m, mm²→m², min→s).');
    if(an.worstTag==='hisoblash') out.push('10 ning darajalarini alohida hisoblang: avval mantissalarni, keyin darajalarni ko‘paytiring.');
    if(an.worstTag==='formula') out.push('Har mavzuning formulalar bo‘limini yozib chiqib, qaysi kattalik qaysi formulada ishlatilishini belgilab qo‘ying.');
    if(an.worstTag==='tushuncha') out.push('Ta’riflarni o‘z so‘zingiz bilan aytib ko‘ring — faqat o‘qish yetarli emas.');
    if(an.worstTag==='yonalish') out.push('Chap va o‘ng qo‘l qoidalarini qo‘lingiz bilan takrorlab mashq qiling.');
    if(an.worstTag==='grafik') out.push('Grafikdan o‘qiganda avval o‘qlarning birligini, keyin qiyalikning ma’nosini aniqlang.');
  }
  if(an.weak.length) out.push('Takrorlash kerak: '+an.weak.slice(0,3).map(function(x){return x.name;}).join(', ')+'.');
  if(an.strong.length) out.push('Yaxshi o‘zlashtirilgan: '+an.strong.slice(0,3).map(function(x){return x.name;}).join(', ')+'.');
  const l3=an.lvls[3], l1=an.lvls[1];
  if(l3 && l3.t>0 && l3.c/l3.t<0.5 && l1 && l1.c/l1.t>=0.8)
    out.push('Oson savollar yaxshi, qiyin savollar qiyinchilik tug‘dirmoqda — ko‘p bosqichli masalalarni ko‘proq ishlash kerak.');
  return out;
}

      + (it.ok? '' : ' — o‘quvchi javobi: "'+it.chosenText+'", to‘g‘ri javob: "'+it.correctText+'"'));
  });
  L.push('');

function reportText(){

  L.push('Sana: '+new Date().toLocaleString('uz-UZ'));
  L.push('Umumiy o‘zlashtirish: '+pct(overall())+'%');
  L.push('');
  L.push('MAVZULAR BO‘YICHA');
  MODULES.forEach(function(m){
    const v=modMastery(m.id);
    const parts=[];
    for(let l=1;l<=3;l++){ const r=P.tests[m.id+'-'+l]; parts.push(LVL_NAME[l]+': '+(r? pct(r.best)+'%':'—')); }
    const exList=E_BY_M[m.id]||[]; let sv=0; exList.forEach(function(e){ if(P.ex[e.id]&&P.ex[e.id].solved) sv++; });
    const labs=LAB_BY_M[m.id]||[]; let ld=0; labs.forEach(function(l){ if(P.labs[l.id]&&P.labs[l.id].done) ld++; });
    L.push(m.id+'. '+m.title);
    L.push('   O‘zlashtirish: '+pct(v)+'%  |  Test — '+parts.join(', ')+'  |  Mashq: '+sv+'/'+exList.length+'  |  Lab: '+ld+'/'+labs.length);
  });
  L.push('');
  L.push('OXIRGI TEST URINISHLARI');
  P.hist.slice(0,12).forEach(function(a){
    L.push('· '+new Date(a.ts).toLocaleDateString('uz-UZ')+' — '+a.title+' ('+a.lvlName+'): '+a.score+'/'+a.total);
    if(a.weak && a.weak.length) L.push('    zaif: '+a.weak.join(', '));
  });
  return L.join('\n');
}
async function saveReport(){
  const txt=reportText();
  const fn='fizika-natijalar-'+(P.name? P.name.replace(/\s+/g,'-'):'oquvchi')+'.txt';
  if(DOWN){
    try{ await DOWN.save({filename:fn, data:txt}); toast('Hisobot saqlandi'); }
    catch(e){ if(!(e && e.code==='declined')) toast('Saqlash amalga oshmadi'); }

  }
  try{

/* ============ FON ANIMATSIYASI ============ */
(function(){
  const cv=$('#bgfx'); if(!cv) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const parts=[];
  for(let i=0;i<34;i++) parts.push({x:Math.random(),y:Math.random(),v:0.00006+Math.random()*0.00018,r:0.6+Math.random()*1.9,p:Math.random()*6.28});
  let t0=performance.now();
  function frame(now){
    const f=fitCanvas(cv); const ctx=f.ctx,w=f.w,h=f.h; const c=TC();
    const dt=Math.min(40,now-t0); t0=now;
    ctx.strokeStyle=c.volt+'1a'; ctx.lineWidth=1;
    for(let k=0;k<4;k++){
      ctx.beginPath();
      for(let x=0;x<=w;x+=12){
        const y=h*(0.2+k*0.2)+Math.sin(x*0.006+now*0.00022+k)*26;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    parts.forEach(function(p){
      if(!reduce){ p.x+=p.v*dt; if(p.x>1.05) p.x=-0.05; }
      const y=p.y*h+Math.sin(now*0.0004+p.p)*10;
      dot(ctx,p.x*w,y,p.r,(p.r>1.6? c.mag : c.volt)+'33');
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ============ ANIMATSIYA BOSHQARUVI ============ */
let GEN=0;
function stopLoops(){ GEN++; }
function runCanvas(cv, fn){
  const g=GEN; const start=performance.now();
  function frame(now){
    if(g!==GEN || !document.body.contains(cv)) return;
    const f=fitCanvas(cv);
    try{ fn(f.ctx,f.w,f.h,(now-start)/1000); }catch(e){}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const z=a[i];a[i]=a[j];a[j]=z; } return a; }

function buildQuiz(mSel, lvl){
  let list = mSel==='all' ? QUESTIONS.slice() : (Q_BY_M[mSel]||[]).slice();
  if(lvl!=='all') list = list.filter(function(q){ return q.lvl===Number(lvl); });
  list = shuffle(list);
  if(mSel==='all') list = list.slice(0,12);
  const items = list.map(function(q){
    const idx=shuffle(q.opts.map(function(_,i){return i;}));
    return {q:q, order:idx, ai:idx.indexOf(q.a), chosen:null, ok:false};
  });
  return {
    mSel:mSel, lvl:lvl, i:0, items:items, score:0, total:items.length, done:false,
    title: mSel==='all'? 'Aralash — barcha mavzular' : (mSel+'. '+M[mSel].title),
    lvlName: lvl==='all'? 'Barcha darajalar' : LVL_NAME[Number(lvl)]
  };
}

     '<button class="pick on" data-act="pick-l" data-l="all"><b>Hammasi</b><small>Uch daraja aralash</small></button>'+
   '</div><div class="row" style="margin-top:20px"><button class="btn btn-main" data-act="run-test">Boshlash</button></div></div>';
}
function testRun(){
  const Q=S.quiz, it=Q.items[Q.i], q=it.q;
  const prog=(Q.i)/Q.total;
  V.innerHTML='<div class="crumb"><button data-act="quit-test">Test</button><span>›</span><span>'+esc(Q.title)+'</span></div>'+
  '<div class="card pad fade">'+
   '<div class="qhead"><span class="chip volt">'+(Q.i+1)+' / '+Q.total+'</span>'+
     '<span class="bar"><i style="width:'+pct(prog)+'%"></i></span>'+
     '<span class="chip">'+LVL_NAME[q.lvl]+' '+lvlDots(q.lvl)+'</span></div>'+
   '<div class="note" style="margin-bottom:8px">'+q.m+'-mavzu · '+esc(q.sub)+'</div>'+
   '<p class="qtext">'+esc(q.q)+'</p>'+
   '<div class="opts" id="opts">'+
     it.order.map(function(oi,k){
       return '<button class="opt" data-act="ans" data-k="'+k+'"><i>'+'ABCD'[k]+'</i><span>'+esc(q.opts[oi])+'</span></button>';
     }).join('')+
   '</div><div id="fb"></div></div>';
}
function answer(k){
  const Q=S.quiz, it=Q.items[Q.i], q=it.q;
  if(it.chosen!==null) return;
  it.chosen=k; it.ok=(k===it.ai);
  it.chosenText=q.opts[it.order[k]]; it.correctText=q.opts[q.a];
  if(it.ok) Q.score++;
  $$('#opts .opt').forEach(function(b,i){
    b.setAttribute('disabled','');
    if(i===it.ai) b.classList.add('good');
    else if(i===k) b.classList.add('wrong');
  });
  const last=(Q.i>=Q.total-1);
  $('#fb').innerHTML='<div class="why pop"><b>'+(it.ok?'To‘g‘ri':'Xato — '+TAGS[q.tag].n)+'</b>'+esc(q.why)+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn btn-main" data-act="next-q">'+(last?'Natijani ko‘rish':'Keyingi savol')+'</button>'+
    '<button class="btn btn-sm" data-act="open-mod" data-m="'+q.m+'">'+q.m+'-mavzuni o‘qish</button></div>';
}
function nextQ(){
  const Q=S.quiz;
  if(Q.i>=Q.total-1){ finishQuiz(); } else { Q.i++; testRun(); window.scrollTo(0,0); }
}
function finishQuiz(){
  const Q=S.quiz; Q.done=true;
  const an=analyze(Q); Q.an=an;
  const r=Q.score/Q.total;
  if(Q.mSel!=='all' && Q.lvl!=='all'){
    const k=Q.mSel+'-'+Q.lvl, cur=P.tests[k]||{best:0,att:0};
    P.tests[k]={best:Math.max(cur.best,r), att:cur.att+1};
  } else if(Q.mSel!=='all'){
    for(let l=1;l<=3;l++){
      const sub=Q.items.filter(function(x){return x.q.lvl===l;});
      if(!sub.length) continue;
      const rr=sub.filter(function(x){return x.ok;}).length/sub.length;
      const k=Q.mSel+'-'+l, cur=P.tests[k]||{best:0,att:0};
      P.tests[k]={best:Math.max(cur.best,rr), att:cur.att+1};
    }
  } else {
    const byM={};
    Q.items.forEach(function(x){ const kk=x.q.m+'-'+x.q.lvl; (byM[kk]=byM[kk]||[]).push(x.ok); });
    Object.keys(byM).forEach(function(kk){
      const a=byM[kk], rr=a.filter(Boolean).length/a.length;
      const cur=P.tests[kk]||{best:0,att:0};
      P.tests[kk]={best:Math.max(cur.best,rr), att:cur.att+1};
    });
  }
  P.hist.unshift({ts:Date.now(),title:Q.title,lvlName:Q.lvlName,score:Q.score,total:Q.total,
    weak:an.weak.slice(0,3).map(function(x){return x.name;}),
    tag:an.worstTag});
  P.hist=P.hist.slice(0,40);
  saveP(); setRing(); testResult(); window.scrollTo(0,0);
}
function testResult(){
  const Q=S.quiz, an=Q.an||analyze(Q);
  const r=Q.score/Q.total;
  const col = r>=0.85?'var(--ok)':(r>=0.6?'var(--warn)':'var(--bad)');
  const tagRows=Object.keys(an.tags).map(function(k){
    const t=an.tags[k], v=t.c/t.t;
    return '<div class="tagbar"><span class="nm">'+TAGS[k].n+'</span>'+
      '<span class="bar"><i style="width:'+pct(v)+'%;background:'+(v>=0.8?'var(--ok)':(v>=0.5?'var(--warn)':'var(--bad)'))+'"></i></span>'+
      '<span class="vl">'+t.c+'/'+t.t+'</span></div>';

  const subRows=Object.keys(an.subs).map(function(k){

      '<td><span class="chip '+(v>=0.8?'ok':(v>=0.5?'warn':'bad'))+'">'+(v>=0.8?'o‘zlashtirilgan':(v>=0.5?'qismli':'takrorlash'))+'</span></td></tr>';
  }).join('');
  const wrong=Q.items.filter(function(x){ return !x.ok; });
  const adv=localAdvice(Q,an);
  const weakMods={}; an.weak.forEach(function(x){ weakMods[x.m]=1; });

  V.innerHTML=
  '<div class="page-h fade"><div><span class="eyebrow">Test natijasi</span><h1>'+esc(Q.title)+'</h1>'+
   '<p>'+Q.lvlName+' · '+new Date().toLocaleString('uz-UZ')+'</p></div>'+
   '<div class="row"><button class="btn btn-sm" data-act="retry-test">Qayta ishlash</button>'+
   '<button class="btn btn-sm" data-act="quit-test">Boshqa test</button></div></div>'+

  '<div class="grid fade" style="grid-template-columns:1fr;gap:14px">'+
   '<div class="card pad"><div class="row" style="gap:24px;align-items:center">'+
     '<div class="score"><b style="color:'+col+'">'+Q.score+'/'+Q.total+'</b><span>'+pct(r)+'% to‘g‘ri</span></div>'+
     '<div style="flex:1;min-width:200px"><span class="eyebrow">Xato turlari bo‘yicha</span>'+
       '<div class="tagbars" style="margin-top:10px">'+tagRows+'</div></div>'+
   '</div></div>'+

   '<div class="ai"><h3><span style="color:var(--volt)">◆</span> AI tahlili</h3>'+
     '<p class="note" style="margin-top:6px">Javoblaringiz mavzu va xato turi bo‘yicha tahlil qilinadi.</p>'+
     '<div class="row" style="margin-top:12px">'+
       '<button class="btn btn-main btn-sm" id="aiBtn" data-act="ai" hidden>AI tahlilini olish</button>'+
       '<span class="note" id="aiNone" hidden>AI tahlili bu oynada ishlamaydi — quyida saytning o‘z tahlili berilgan.</span>'+
     '</div>'+
     '<div class="ai-body" id="aiBox"></div>'+
     '<hr class="sep" style="margin:16px 0">'+
     '<div class="ai-sec"><h4>Avtomatik tahlil</h4><ul>'+adv.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'+
     (Object.keys(weakMods).length? '<div class="row" style="margin-top:12px">'+
        Object.keys(weakMods).map(function(id){ return '<button class="btn btn-sm" data-act="open-mod" data-m="'+id+'">'+id+'-mavzuni takrorlash</button>'; }).join('')+
       '</div>':'')+
   '</div>'+

   '<div class="card pad"><span class="eyebrow">Kichik mavzular bo‘yicha o‘zlashtirish</span>'+
     '<div class="tscroll" style="margin-top:10px"><table class="data"><thead><tr><th>№</th><th>Kichik mavzu</th><th>Natija</th><th>Holat</th></tr></thead><tbody>'+subRows+'</tbody></table></div></div>'+

   (wrong.length? '<div class="card pad"><span class="eyebrow">Xato qilgan savollar ('+wrong.length+')</span><div class="grid" style="margin-top:12px;gap:14px">'+
     wrong.map(function(x){
       return '<div style="border-left:2px solid var(--bad);padding-left:14px">'+
        '<div class="note">'+x.q.m+'-mavzu · '+esc(x.q.sub)+' · '+TAGS[x.q.tag].n+'</div>'+
        '<p style="font-weight:600;margin-top:4px">'+esc(x.q.q)+'</p>'+
        '<p class="note" style="margin-top:6px">Sizning javobingiz: <span style="color:var(--bad)">'+esc(x.chosenText)+'</span></p>'+
        '<p class="note">To‘g‘ri javob: <span style="color:var(--ok)">'+esc(x.correctText)+'</span></p>'+
        '<p style="font-size:14px;margin-top:6px">'+esc(x.q.why)+'</p></div>';
     }).join('')+'</div></div>':
     '<div class="card pad"><p style="text-align:center;color:var(--ok);font-weight:600">Barcha savollarga to‘g‘ri javob berdingiz.</p></div>')+
  '</div>';
  const ab=$('#aiBtn'); if(ab) ab.hidden = !SAMPLE || !SAMPLE_READY;
  const nb=$('#aiNone'); if(nb) nb.hidden = !(SAMPLE_READY && !SAMPLE);
}

function viewMashq(){
  if(!S.mash) return mashSetup();
  if(!S.mash.list) return mashList();

}

function modExStat(id){
  const list=E_BY_M[id]||[]; let sv=0;
  list.forEach(function(e){ if(exDone(e)) sv++; });
  return {n:list.length, s:sv};
}

}
function mashList(){
  const id=S.mash.m, m=M[id];
  V.innerHTML='<div class="crumb"><button data-act="quit-mash">Mashq</button><span>›</span><span>'+id+'-mavzu</span></div>'+
