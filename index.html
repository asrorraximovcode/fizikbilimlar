     return '<div class="card pad catcard" style="--c:'+EXCATS[cat].c+'">'+
      '<div class="page-h" style="margin-bottom:12px"><div><span class="catbadge">'+EXCATS[cat].n+'</span>'+
      '<p class="note" style="margin-top:6px">'+esc(EXCATS[cat].d)+'</p></div>'+
      '<span class="chip '+(sv===list.length&&list.length?'ok':'')+'">'+sv+'/'+list.length+'</span></div>'+
      '<div class="mlist">'+list.map(function(e,k){
        return '<button class="mcard'+(exDone(e)?' done':'')+'" data-act="open-ex" data-ex="'+e.id+'">'+
          '<span class="mnum">'+(k+1)+'</span>'+
          '<span><h3>'+esc(e.sub)+'</h3><p>'+esc(e.q.length>92? e.q.slice(0,92)+'…' : e.q)+'</p></span>'+
          '<span class="chip '+(exDone(e)?'ok':'')+'">'+(exDone(e)?'yechilgan':(e.type==='choice'?'test':'hisob'))+'</span></button>';

}
function mashRun(){
  const K=S.mash, e=K.list[K.i];
  const st=P.ex[e.id]||{};
  const cat=EXCATS[e.cat];
  V.innerHTML='<div class="crumb"><button data-act="quit-mash">Mashq</button><span>›</span>'+
   '<button data-act="open-mash-mod" data-m="'+e.m+'">'+e.m+'-mavzu</button><span>›</span><span>'+cat.n+'</span></div>'+
  '<div class="card pad fade" style="--c:'+cat.c+'">'+
   '<div class="qhead"><span class="catbadge">'+cat.n+'</span>'+
     '<span class="chip">'+(K.i+1)+' / '+K.list.length+'</span>'+
     '<span class="bar"><i style="width:'+pct((K.i)/K.list.length)+'%"></i></span>'+
     (st.solved? '<span class="chip ok">yechilgan</span>':'')+'</div>'+
   '<div class="note" style="margin-bottom:8px">'+esc(e.sub)+'</div>'+
   '<p class="qtext">'+esc(e.q)+'</p>'+
   (e.type==='num'
     ? '<div style="margin-top:14px"><span class="eyebrow">Berilgan</span><div class="given" style="margin-top:8px">'+
       e.given.map(function(g){ return '<div class="gitem"><b>'+esc(g.v)+'</b><span>'+esc(g.s)+'</span></div>'; }).join('')+
       '</div></div>'+
       '<div class="ansrow" style="margin-top:18px">'+
         '<div class="ansin"><input id="ansIn" inputmode="decimal" placeholder="javob" autocomplete="off"><span>'+esc(e.unit||'')+'</span></div>'+
         '<button class="btn btn-main" data-act="check-ex">Tekshirish</button>'+
         '<button class="btn btn-sm btn-amp" data-act="hint">Ishora</button>'+
         '<button class="btn btn-sm" data-act="solve">Yechimni ko‘rsatish</button>'+
       '</div>'+
       '<p class="note" style="margin-top:8px">Kasr son uchun nuqta yoki vergul yozsa bo‘ladi. Katta/kichik sonlar: 1.5e-5 shaklida.</p>'
     : '<div class="opts" id="exOpts">'+
       e.opts.map(function(o,i){ return '<button class="opt" data-act="ex-opt" data-k="'+i+'"><i>'+'ABCD'[i]+'</i><span>'+esc(o)+'</span></button>'; }).join('')+
       '</div>')+
   '<div id="exfb"></div>'+
   '<div class="row" style="margin-top:16px;justify-content:space-between">'+
     (K.i>0? '<button class="btn btn-sm" data-act="prev-ex">← Oldingi</button>':'<span></span>')+
     (K.i<K.list.length-1? '<button class="btn btn-sm" data-act="next-ex">Keyingi →</button>':
       '<button class="btn btn-sm" data-act="open-mash-mod" data-m="'+e.m+'">Mavzuga qaytish</button>')+
   '</div></div>';
  const inp=$('#ansIn');
  if(inp) inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter') checkEx(); });
  K.hint=0;
}
function stepsHTML(e){
  return '<div style="margin-top:14px"><span class="eyebrow">Yechim bosqichlari</span><div class="steps" style="margin-top:10px">'+
    e.steps.map(function(s){ return '<div class="step"><div><p>'+esc(s.p)+'</p><span class="fml">'+mathHTML(s.f)+'</span></div></div>'; }).join('')+
    '</div></div>';
}
function checkEx(){
  const K=S.mash, e=K.list[K.i];
  const raw=$('#ansIn').value;
  const v=parseNum(raw);
  const st=P.ex[e.id]||{solved:false,tries:0};
  st.tries=(st.tries||0)+1;
  if(isNaN(v)){
    $('#exfb').innerHTML='<div class="why pop" style="border-left-color:var(--warn)"><b>Javob o‘qilmadi</b>Faqat son kiriting, masalan 2,7 yoki 1.5e-5.</div>';
    return;
  }
  if(near(v,e.ans,e.tol)){
    st.solved=true; P.ex[e.id]=st; saveP(); setRing();
    $('#exfb').innerHTML='<div class="why pop" style="border-left-color:var(--ok)"><b style="color:var(--ok)">To‘g‘ri</b>'+
      'Javob: '+fmt(e.ans)+' '+esc(e.unit||'')+'. '+(st.tries<=1?'Birinchi urinishda topdingiz.':'Urinishlar soni: '+st.tries+'.')+'</div>'+stepsHTML(e);
  } else {
    P.ex[e.id]=st; saveP();
    const rel=Math.abs((v-e.ans)/(e.ans||1));
    let tip='Qiymatni qayta hisoblab ko‘ring.';
    if(rel>8 && rel<12) tip='Natija 10 marta farq qiladi — birliklarni (sm→m, mm²→m², min→s) tekshirib ko‘ring.';
    else if(rel>80) tip='Natija tartibi juda farq qiladi — 10 ning darajalarini alohida hisoblang.';
    else if(rel<0.25) tip='Yaqin keldingiz — oraliq hisobda aniqlikni oshiring yoki formulani qayta ko‘rib chiqing.';
    $('#exfb').innerHTML='<div class="why pop" style="border-left-color:var(--bad)"><b style="color:var(--bad)">Hali to‘g‘ri emas</b>'+esc(tip)+'</div>';
  }
}
function exOpt(k){
  const K=S.mash, e=K.list[K.i];
  const btns=$$('#exOpts .opt');
  if(btns.length && btns[0].hasAttribute('disabled')) return;
  btns.forEach(function(b,i){
    b.setAttribute('disabled','');
    if(i===e.ans) b.classList.add('good'); else if(i===k) b.classList.add('wrong');
  });
  const ok=(k===e.ans);
  const st=P.ex[e.id]||{solved:false,tries:0};
  st.tries=(st.tries||0)+1;
  if(ok){ st.solved=true; }
  P.ex[e.id]=st; saveP(); setRing();
  $('#exfb').innerHTML='<div class="why pop" style="border-left-color:'+(ok?'var(--ok)':'var(--bad)')+'">'+
    '<b style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'To‘g‘ri':'Xato')+'</b>'+esc(e.why)+'</div>';
}
function showHint(){
  const K=S.mash, e=K.list[K.i];
  if(!e.hints || !e.hints.length) return;
  K.hint=Math.min((K.hint||0)+1, e.hints.length);
  $('#exfb').innerHTML='<div class="why pop" style="border-left-color:var(--amp)"><b style="color:var(--amp)">Ishora '+K.hint+' / '+e.hints.length+'</b>'+
    esc(e.hints[K.hint-1])+'</div>';
  const st=P.ex[e.id]||{solved:false,tries:0}; st.hint=K.hint; P.ex[e.id]=st; saveP();
}
function showSolve(){
  const K=S.mash, e=K.list[K.i];
  $('#exfb').innerHTML=stepsHTML(e)+'<p class="note" style="margin-top:10px">Javob: <b>'+fmt(e.ans)+' '+esc(e.unit||'')+'</b></p>';
}
</script>

     '<div class="row"><button class="btn btn-sm btn-main" data-act="measure">O‘lchash</button>'+
     '<button class="btn btn-sm" data-act="clear-meas">Tozalash</button></div></div>'+
     '<div class="tscroll"><table class="data" id="measT"><thead><tr><th>№</th>'+
       def.cols.map(function(c){ return '<th>'+c+'</th>'; }).join('')+'</tr></thead><tbody></tbody></table></div>'+
     '<p class="note" id="measEmpty" style="margin-top:10px">Jadval hozircha bo‘sh.</p></div>':'')+

   '<div class="card pad"><span class="eyebrow">Ishni bajarish tartibi</span>'+
     '<ol class="labsteps" style="margin-top:11px">'+L.steps.map(function(s){ return '<li><span>'+esc(s)+'</span></li>'; }).join('')+'</ol></div>'+

   /* --- o'quvchi to'ldiradigan jadval va xatoliklar --- */
   '<div class="card pad">'+
     '<div class="page-h" style="margin-bottom:12px"><div><span class="eyebrow">O‘lchash natijalari jadvali</span>'+
       '<p class="note">O‘lchangan kattalik: <b>'+esc(ms.name)+(ms.unit?', '+esc(ms.unit):'')+'</b></p></div>'+
       '<div class="row">'+(def?'<button class="btn btn-sm" data-act="err-import">Simulyator jadvalidan olish</button>':'')+
       '<button class="btn btn-sm" data-act="err-add">+ qator</button>'+
       '<button class="btn btn-sm" data-act="err-clear">Tozalash</button></div></div>'+
     '<div class="errnote" style="margin-bottom:14px"><b>Topshiriq.</b> O‘lchash natijalari asosida absolut va nisbiy xatolikni aniqlang.</div>'+
     '<div class="tscroll"><table class="errtbl" id="errT"><thead><tr>'+
       '<th>№</th><th>'+esc(ms.name)+(ms.unit?' , '+esc(ms.unit):'')+'</th>'+
       '<th>Δx<sub>i</sub> = |x<sub>i</sub> − x̄|</th></tr></thead><tbody id="errBody"></tbody></table></div>'+
     '<div class="errgrid" style="margin-top:14px">'+
       '<div class="errout" id="errOut"></div>'+
       '<div class="errfinal" id="errFinal"></div>'+
       '<div class="fmlrow"><div class="fname">Hisoblash formulalari</div>'+
         '<span class="fml">'+mathHTML('\\text{x̄} = \\frac{x_1 + x_2 + … + x_n}{n}')+'</span>'+
         '<span class="fml">'+mathHTML('Δx = \\frac{\\abs{x_1 − \\text{x̄}} + … + \\abs{x_n − \\text{x̄}}}{n}')+'</span>'+
         '<span class="fml">'+mathHTML('ε = \\frac{Δx}{\\text{x̄}}·100%')+'</span>'+
       '</div>'+
     '</div>'+
   '</div>'+

   '<div class="card pad"><span class="eyebrow">Hisobot savoli</span>'+
    '<p class="qtext" style="margin-top:8px;font-size:16px">'+esc(L.task.q)+'</p>'+
    (L.task.type==='num'
      ? '<div class="ansrow" style="margin-top:14px"><div class="ansin"><input id="labIn" inputmode="decimal" placeholder="javob" autocomplete="off"><span>'+esc(L.task.unit||'')+'</span></div>'+
        '<button class="btn btn-main" data-act="check-lab">Tekshirish</button></div>'
      : '<div class="opts" style="margin-top:12px" id="labOpts">'+
        L.task.opts.map(function(o,i){ return '<button class="opt" data-act="lab-opt" data-k="'+i+'"><i>'+'ABCD'[i]+'</i><span>'+esc(o)+'</span></button>'; }).join('')+'</div>')+
    '<div id="labfb"></div></div>'+

   '<div class="card pad"><span class="eyebrow">Laboratoriyani bajarish uchun qo‘llanma va videolar</span><div class="extlinks" style="margin-top:11px">'+
     L.links.map(function(k){
       return '<a class="extlink" href="'+esc(k.u)+'" target="_blank" rel="noopener">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>'+
        '<span>'+esc(k.l)+'</span></a>';
     }).join('')+'</div>'+
     '<p class="note" style="margin-top:10px">Havolalar yangi oynada ochiladi.</p></div>'+

   '<div class="row" style="justify-content:space-between">'+
     (L.id>1? '<button class="btn btn-sm" data-act="open-lab" data-lab="'+(L.id-1)+'">← '+(L.id-1)+'-ish</button>':'<span></span>')+
     (L.id<14? '<button class="btn btn-sm" data-act="open-lab" data-lab="'+(L.id+1)+'">'+(L.id+1)+'-ish →</button>':'<span></span>')+
   '</div>'+
  '</div>';

  if(def) mountSim(def,L);
  errInit(L);
  const li=$('#labIn');
  if(li) li.addEventListener('keydown',function(ev){ if(ev.key==='Enter') checkLab(); });
}

/* ---------- simulyator ---------- */
let SIMST=null;
function mountSim(def,L){
  const s={};
  def.ctl.forEach(function(c){ s[c.k]=c.val; });
  (def.sw||[]).forEach(function(c){ s[c.k]=c.val; });
  if(def.init) def.init(s);
  SIMST={s:s,def:def,rows:[],lab:L};

  const ctl=$('#simCtl');
  ctl.innerHTML =
    '<div class="readout" id="roBox"></div>'+
    ((def.sw&&def.sw.length)? def.sw.map(function(c,ci){
      return '<div><div class="lb" style="font-size:13px;color:var(--fg2);margin-bottom:6px">'+esc(c.lb)+'</div>'+
        '<div class="switchrow">'+c.opts.map(function(o,i){
          return '<button class="sw'+(i===c.val?' on':'')+'" data-sw="'+ci+'" data-i="'+i+'">'+esc(o)+'</button>';
        }).join('')+'</div></div>';
    }).join('') : '')+
    '<div class="sldgrid">'+def.ctl.map(function(c,ci){
      return '<div class="sld"><div class="lb"><span>'+esc(c.lb)+'</span><b id="sv'+ci+'">'+c.val+' '+c.u+'</b></div>'+
        '<input type="range" id="sl'+ci+'" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+c.val+'"></div>';
    }).join('')+'</div>';

  def.ctl.forEach(function(c,ci){
    const el=$('#sl'+ci);
    el.addEventListener('input',function(){
      s[c.k]=parseFloat(el.value);
      const dec=String(c.step).split('.')[1];
      $('#sv'+ci).textContent=(dec? s[c.k].toFixed(dec.length) : s[c.k])+' '+c.u;
    });
  });
  $$('#simCtl .sw').forEach(function(b){
    b.addEventListener('click',function(){
      const ci=Number(b.getAttribute('data-sw')), i=Number(b.getAttribute('data-i'));
      s[def.sw[ci].k]=i;
      $$('#simCtl .sw').forEach(function(o){ if(Number(o.getAttribute('data-sw'))===ci) o.classList.toggle('on', o===b); });
      if(def.sw[ci].k==='src'||def.sw[ci].k==='col'){ s._ang=0.4; s._w=0; s._peak=0; }
    });
  });

  const cv=$('#simCv');
  if(def.drag){
    const setPos=function(ev){
      const r=cv.getBoundingClientRect();
      const px=(ev.touches? ev.touches[0].clientX : ev.clientX)-r.left;
      const py=(ev.touches? ev.touches[0].clientY : ev.clientY)-r.top;
      s.cxp=Math.max(0.04,Math.min(0.96,px/r.width));
      s.cyp=Math.max(0.08,Math.min(0.92,py/r.height));
    };
    let on=false;
    cv.addEventListener('pointerdown',function(ev){ on=true; cv.setPointerCapture(ev.pointerId); setPos(ev); });
    cv.addEventListener('pointermove',function(ev){ if(on){ ev.preventDefault(); setPos(ev); } });
    cv.addEventListener('pointerup',function(){ on=false; });
    cv.style.cursor='grab';
  }

  const roBox=$('#roBox');
  let lastRo='';
  runCanvas(cv,function(ctx,w,h,t){
    const o=def.out(s);
    SIMST.o=o; SIMST.w=w; SIMST.h=h;
    def.draw(ctx,w,h,s,o,t);
    const ro=def.ro(s,o);
    const html=ro.map(function(r){
      return '<div class="ro '+(r.c||'')+'"><b>'+esc(r.v)+'</b><span>'+esc(r.l)+'</span></div>';
    }).join('');
    if(html!==lastRo){ roBox.innerHTML=html; lastRo=html; }
  });
}
function measure(){
  if(!SIMST) return;
  const r=SIMST.def.meas(SIMST.s,SIMST.o,SIMST.w,SIMST.h);
  /* haqiqiy o'lchovdagidek kichik tarqoqlik — xatolik hisobi ma'noga ega bo'lishi uchun */
  const L=SIMST.lab, c=(L.meas||{}).col;
  if(c!==undefined && r[c]!==undefined){
    const raw=String(r[c]), v=parseNum(raw);
    if(!isNaN(v) && v!==0){
      const dot=raw.indexOf('.')>=0? raw.length-raw.indexOf('.')-1 : (raw.indexOf(',')>=0? raw.length-raw.indexOf(',')-1 : 0);
      const jit=v*(1+(Math.random()-0.5)*0.022);
      r[c]=jit.toFixed(Math.max(dot, Math.abs(jit)>=100?1:(Math.abs(jit)>=1?2:4)));
    }
  }
  SIMST.rows.push(r);
  drawMeas();
  toast('Simulyator jadvaliga yozildi ('+SIMST.rows.length+')');
}
function clearMeas(){ if(SIMST){ SIMST.rows=[]; drawMeas(); } }
function drawMeas(){
  const tb=$('#measT tbody'); if(!tb) return;
  tb.innerHTML=SIMST.rows.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>';
  }).join('');
  const e=$('#measEmpty'); if(e) e.hidden=SIMST.rows.length>0;
}

/* ---------- o'quvchi jadvali va xatoliklar ---------- */
let ERR=null;
function errInit(L){
  const st=P.labs[L.id]||{};
  let vals=(st.err && st.err.length)? st.err.slice() : ['','','','',''];
  if(vals.length<3) while(vals.length<3) vals.push('');
  ERR={lab:L, vals:vals, ms:L.meas||{name:'x',unit:'',col:1}};
  errRender();
}
function errSave(){
  if(!ERR) return;
  const st=P.labs[ERR.lab.id]||{}; st.err=ERR.vals.slice(); P.labs[ERR.lab.id]=st; saveP();
}
function errNums(){
  const out=[];
  ERR.vals.forEach(function(v){ const n=parseNum(v); if(!isNaN(n)) out.push(n); });
  return out;
}
function errStats(){
  const a=errNums();
  if(a.length<2) return null;
  let sum=0; a.forEach(function(x){ sum+=x; });
  const mean=sum/a.length;
  let ds=0; a.forEach(function(x){ ds+=Math.abs(x-mean); });
  const dx=ds/a.length;
  const eps= mean!==0 ? Math.abs(dx/mean)*100 : 0;
  return {n:a.length, mean:mean, dx:dx, eps:eps};
}
function decFor(a){ a=Math.abs(a); return a>=100?1:(a>=10?2:(a>=1?3:(a>=0.1?4:(a>=0.001?5:7)))); }
function nf(x,d){
  if(!isFinite(x)) return '—';
  const dec = d!==undefined? d : decFor(x);
  return x.toFixed(dec).replace('.',',');
}
function errRender(){
  const tb=$('#errBody'); if(!tb||!ERR) return;
  const st=errStats();
  tb.innerHTML=ERR.vals.map(function(v,i){
    const n=parseNum(v);
    let d='—';
    if(st && !isNaN(n)) d=nf(Math.abs(n-st.mean), decFor(st.mean));
    return '<tr><td class="idx">'+(i+1)+'</td>'+
      '<td><input data-err="'+i+'" inputmode="decimal" value="'+esc(v)+'" placeholder="—" autocomplete="off"></td>'+
      '<td class="calc">'+d+'</td></tr>';
  }).join('');
  $$('#errBody input').forEach(function(inp){
    inp.addEventListener('input',function(){
      ERR.vals[Number(inp.getAttribute('data-err'))]=inp.value;
      errSave(); errStatsRender();
    });
    inp.addEventListener('blur',errRender);
  });
  errStatsRender();
}
function errStatsRender(){
  const out=$('#errOut'), fin=$('#errFinal');
  if(!out||!fin||!ERR) return;
  const st=errStats(), u=ERR.ms.unit?(' '+ERR.ms.unit):'';
  if(!st){
    out.innerHTML='<div class="ro"><b>—</b><span>o‘rtacha x̄</span></div>'+
      '<div class="ro"><b>—</b><span>absolut Δx</span></div>'+
      '<div class="ro"><b>—</b><span>nisbiy ε</span></div>';
    fin.innerHTML='<span class="note" style="font-family:var(--f-body)">Kamida ikkita o‘lchov qiymatini kiriting — o‘rtacha qiymat, absolut va nisbiy xatolik avtomatik hisoblanadi.</span>';
    return;
  }
  out.innerHTML=
    '<div class="ro volt"><b>'+nf(st.mean,decFor(st.mean))+'</b><span>o‘rtacha x̄'+esc(u)+'</span></div>'+
    '<div class="ro amp"><b>'+nf(st.dx,decFor(st.mean))+'</b><span>absolut Δx'+esc(u)+'</span></div>'+
    '<div class="ro"><b style="color:'+(st.eps<5?'var(--ok)':(st.eps<15?'var(--warn)':'var(--bad)'))+'">'+nf(st.eps,1)+'%</b><span>nisbiy ε</span></div>'+
    '<div class="ro"><b>'+st.n+'</b><span>o‘lchovlar soni</span></div>';
  fin.innerHTML=mathHTML('x = '+nf(st.mean,decFor(st.mean))+' ± '+nf(st.dx,decFor(st.mean))+'\\text{ '+ERR.ms.unit+'}')+
    '<span class="note" style="font-family:var(--f-body);display:block;margin-top:6px">Nisbiy xatolik ε = '+nf(st.eps,1)+'% — '+
    (st.eps<5?'o‘lchov aniq bajarilgan.':(st.eps<15?'o‘lchovni takrorlab aniqlikni oshirish mumkin.':'tarqoqlik katta, o‘lchovni qaytadan bajaring.'))+'</span>';
}
function errAdd(){ if(!ERR) return; if(ERR.vals.length>=10){ toast('Ko‘pi bilan 10 qator'); return; } ERR.vals.push(''); errSave(); errRender(); }
function errClear(){ if(!ERR) return; ERR.vals=ERR.vals.map(function(){ return ''; }); errSave(); errRender(); }
function errImport(){
  if(!ERR||!SIMST||!SIMST.rows.length){ toast('Avval simulyatorda «O‘lchash» tugmasini bosing'); return; }
  const col=ERR.ms.col;
  const vals=SIMST.rows.map(function(r){ return String(r[col]!==undefined? r[col] : ''); })
    .filter(function(v){ return !isNaN(parseNum(v)); });
  if(!vals.length){ toast('Jadvalda son qiymat topilmadi'); return; }
  ERR.vals=vals.slice(0,10);
  while(ERR.vals.length<3) ERR.vals.push('');
  errSave(); errRender();
  toast(vals.length+' ta qiymat ko‘chirildi');
}

/* ---------- hisobot savoli ---------- */
function labOk(L){
  const st=P.labs[L.id]||{}; st.done=true; P.labs[L.id]=st; saveP(); setRing();
}
function checkLab(){
  const L=SIMST? SIMST.lab : LABS.filter(function(x){return x.id===S.lab;})[0];
  const v=parseNum($('#labIn').value);
  if(isNaN(v)){
    $('#labfb').innerHTML='<div class="why pop" style="border-left-color:var(--warn)"><b>Javob o‘qilmadi</b>Faqat son kiriting.</div>';
    return;
  }
  if(near(v,L.task.ans,L.task.tol)){
    labOk(L);
    $('#labfb').innerHTML='<div class="why pop" style="border-left-color:var(--ok)"><b style="color:var(--ok)">To‘g‘ri — ish qabul qilindi</b>'+
      'Javob: '+fmt(L.task.ans)+' '+esc(L.task.unit||'')+'. Endi o‘lchash jadvalingiz bo‘yicha absolut va nisbiy xatolikni ham yozib qo‘ying.</div>';
  } else {
    $('#labfb').innerHTML='<div class="why pop" style="border-left-color:var(--bad)"><b style="color:var(--bad)">Mos kelmadi</b>'+
      'Simulyatordagi qiymatlarni topshiriqda berilgan shartga keltirib, qaytadan o‘lchab ko‘ring. Birliklarga ham e’tibor bering.</div>';
  }
}
function labOpt(k){
  const L=SIMST? SIMST.lab : LABS.filter(function(x){return x.id===S.lab;})[0];
  const btns=$$('#labOpts .opt');
  if(btns.length && btns[0].hasAttribute('disabled')) return;
  btns.forEach(function(b,i){
    b.setAttribute('disabled','');
    if(i===L.task.ans) b.classList.add('good'); else if(i===k) b.classList.add('wrong');
  });
  const ok=(k===L.task.ans);
  if(ok) labOk(L);
  $('#labfb').innerHTML='<div class="why pop" style="border-left-color:'+(ok?'var(--ok)':'var(--bad)')+'">'+
    '<b style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'To‘g‘ri — ish qabul qilindi':'Xato')+'</b>'+
    esc(L.theory.split('.')[0])+'.</div>';
}

/* ============ HODISALAR ============ */
V.addEventListener('click',function(ev){
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.getAttribute('data-act');
  const m=b.getAttribute('data-m'), lab=b.getAttribute('data-lab'), k=b.getAttribute('data-k');
  switch(a){
    case 'go-test': S.quiz=null; nav('test'); break;
    case 'go-modul': nav('modul'); break;
    case 'go-mashq': S.mash=null; nav('mashq'); break;
    case 'go-lab': nav('lab'); break;
    case 'open-mod': nav('lesson',{m:Number(m)}); break;
    case 'open-lab': nav('labone',{lab:Number(lab)}); break;
    case 'report': saveReport(); break;
    case 'pick-m':
      $$('[data-act="pick-m"]').forEach(function(x){ x.classList.toggle('on',x===b); });
      V._pm=m; break;
    case 'pick-l':
      $$('[data-act="pick-l"]').forEach(function(x){ x.classList.toggle('on',x===b); });
      V._pl=b.getAttribute('data-l'); break;
    case 'run-test': {
      const mm=V._pm||'all', ll=V._pl||'all';
      const q=buildQuiz(mm==='all'?'all':Number(mm), ll);
      if(!q.items.length){ toast('Bu tanlov uchun savol topilmadi'); return; }
      S.quiz=q; render(); window.scrollTo(0,0); break;
    }
    case 'ans': answer(Number(k)); break;
    case 'next-q': nextQ(); break;
    case 'quit-test': S.quiz=null; nav('test'); break;
    case 'retry-test': {
      const q=S.quiz; S.quiz=buildQuiz(q.mSel,q.lvl); render(); window.scrollTo(0,0); break;
    }
    case 'ai': runAI(S.quiz,S.quiz.an,$('#aiBox'),b); break;
    case 'start-test': { S.quiz=buildQuiz(Number(m),'all'); nav('test'); break; }
    case 'start-mash':
    case 'open-mash-mod': S.mash={m:Number(m)}; nav('mashq'); break;
    case 'open-ex': {
      const id=b.getAttribute('data-ex');
      const e=EXERCISES.filter(function(x){ return x.id===id; })[0];
      if(!e){ toast('Mashq topilmadi'); return; }
      const list=(E_BY_CAT[e.m+'|'+e.cat]||[]).slice();
      S.mash={m:e.m, cat:e.cat, list:list, i:Math.max(0,list.indexOf(e)), hint:0};
      nav('mashq'); break;
    }
    case 'ex-opt': exOpt(Number(k)); break;
    case 'quit-mash': S.mash=null; nav('mashq'); break;
    case 'check-ex': checkEx(); break;
    case 'hint': showHint(); break;
    case 'solve': showSolve(); break;
    case 'next-ex': S.mash.i++; mashRun(); window.scrollTo(0,0); break;
    case 'prev-ex': S.mash.i--; mashRun(); window.scrollTo(0,0); break;
    case 'measure': measure(); break;
    case 'clear-meas': clearMeas(); break;
    case 'err-add': errAdd(); break;
    case 'err-clear': errClear(); break;
    case 'err-import': errImport(); break;
    case 'check-lab': checkLab(); break;
    case 'lab-opt': labOpt(Number(k)); break;
  }
});

window.addEventListener('resize',function(){ clearTC(); });

/* ============ ISHGA TUSHIRISH ============ */
nav('home');
